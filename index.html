<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能投研复盘系统 V9</title>
    <!--
      HashRouter 路由说明：
      本应用使用 React Router HashRouter，所有路由需以 /#/ 前缀访问。
      例如：/mock-test 路由需访问 /#/mock-test
      以下脚本确保直接访问非 hash 路径时自动重定向到对应 hash 路径。
    -->
    <script>
      (function () {
        var path = window.location.pathname;
        var hash = window.location.hash;
        // 如果路径是非根路径（静态文件或 SPA fallback）且当前没有 hash 导航
        if (path !== '/' && !hash && !path.endsWith('.js') && !path.endsWith('.css') && !path.endsWith('.svg') && !path.endsWith('.png') && !path.endsWith('.ico')) {
          // 将路径转为 hash 路由并重定向
          window.location.replace(window.location.origin + '/#' + path);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
