name: Visual Baseline Update

# 手动触发：用于在 Docker 统一环境中生成视觉回归基线
# 用途：消除 Windows/macOS/Linux 跨平台渲染差异，建立基线真相源
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '目标分支（默认 main）'
        required: true
        default: 'main'
      commit_message:
        description: '提交信息前缀'
        required: true
        default: 'chore: update visual regression baselines via Docker'

permissions:
  contents: write

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Docker 基线生成
  # ════════════════════════════════════════════════════════════════════════════
  generate-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # 设置 Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@988b5a0280414a5213010198a302fdf5e5322a6c # v3.6.1

      # 构建并运行视觉回归基线更新
      - name: Build & update visual baselines (Docker)
        run: |
          docker compose -f e2e/docker-compose.yml build visual-update
          docker compose -f e2e/docker-compose.yml run --rm visual-update

      # 检查基线变更
      - name: Check baseline changes
        id: check_changes
        run: |
          if git diff --quiet -- e2e/visual-regression.spec.ts-snapshots/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "无基线变更，无需提交"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "基线有变更，准备提交"
            git diff --stat -- e2e/visual-regression.spec.ts-snapshots/
          fi

      # 提交并推送变更
      - name: Commit & push baseline changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/visual-regression.spec.ts-snapshots/
          git commit -m "${{ github.event.inputs.commit_message }}"
          git push

      # 上传更新后的基线作为 artifact（无论是否有变更）
      - name: Upload updated baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-baselines
          path: e2e/visual-regression.spec.ts-snapshots/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # 回归验证：确认新基线可通过 CI 比对
  # ════════════════════════════════════════════════════════════════════════════
  verify-baseline:
    needs: generate-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@988b5a0280414a5213010198a302fdf5e5322a6c # v3.6.1

      - name: Verify baselines with Docker regression
        run: |
          docker compose -f e2e/docker-compose.yml build visual-test
          docker compose -f e2e/docker-compose.yml run --rm visual-test

      - name: Upload verification results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-verification-failures
          path: |
            test-results/
            e2e/visual-regression.spec.ts-snapshots/
          retention-days: 3
