# .github/workflows/playwright-screenshot.yml
# Playwright 自动化截图：pytest 运行 → 截图产物 → Artifacts 自动上传
# 用途：在 CI 环境无头运行 Playwright 截图测试，失败时自动保留截图供排查
name: Playwright Screenshot

on:
  push:
    branches: ['feat/**', 'fix/**']
    paths:
      - 'scripts/screenshot_core.py'
      - 'tests/e2e/test_screenshot.py'
      - '.github/workflows/playwright-screenshot.yml'
  pull_request:
    paths:
      - 'scripts/screenshot_core.py'
      - 'tests/e2e/test_screenshot.py'
      - '.github/workflows/playwright-screenshot.yml'
  workflow_dispatch:
    inputs:
      urls:
        description: '逗号分隔的目标 URL 列表 (可选，覆盖测试脚本中的默认列表)'
        required: false
        default: ''
      viewport_width:
        description: '视口宽度'
        required: false
        default: '1440'
      viewport_height:
        description: '视口高度'
        required: false
        default: '900'

permissions:
  contents: read

jobs:
  screenshot:
    name: Playwright Screenshot (pytest + Artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SCREENSHOT_DIR: outputs/test-screenshots

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright pytest

      - name: Install Playwright Chromium (headless)
        run: python -m playwright install chromium

      - name: Run screenshot tests
        id: test
        run: |
          mkdir -p "${SCREENSHOT_DIR}"
          python -m pytest tests/e2e/test_screenshot.py \
            -v \
            --tb=short \
            -o "addopts="
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload screenshots as Artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c695131ce0f3a21bb6e049c944092a6 # v4.4.3
        with:
          name: playwright-screenshots-${{ github.sha }}
          path: ${{ env.SCREENSHOT_DIR }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload pytest results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c695131ce0f3a21bb6e049c944092a6 # v4.4.3
        with:
          name: playwright-test-results-${{ github.sha }}
          path: |
            pytest-results/
          if-no-files-found: ignore
          retention-days: 7