# .github/workflows/embedding-health-check.yml
# Embedding 服务健康检查：验证 CPU 模式下 health 接口如实上报 dtype=float32
# 触发条件：embedding 相关代码变更时 + PR 到 main/develop + 手动触发
# 注意：此工作流需下载 1.3GB 模型（首次约 5-10 分钟，后续走 cache 秒级恢复）
name: Embedding Health Check

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/embedding_service.py'
      - 'backend/embedding_daemon.py'
      - 'backend/requirements.txt'
      - 'scripts/verify-embedding-dtype.py'
      - 'scripts/embedding.env'
      - '.github/workflows/embedding-health-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dtype-verify:
    name: Embedding dtype verification (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 初期 advisory 模式：不阻塞 PR，仅报告结果
    # 待稳定运行 2 周后可改为 false 使其阻断
    continue-on-error: true

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # 预检：验证工作流 YAML 结构 + 触发路径配置正确性（48 项用例，<3s）
      # 在下载 1.3GB 模型前先确认配置无退化，fail fast
      - name: "Pre-check: validate workflow structure (48 cases)"
        run: |
          pip install pyyaml --quiet
          python tests/test_ci_trigger_paths.py

      # 缓存 1.3GB 模型：首次下载约 5-10 分钟，后续 cache 命中秒级恢复
      # 强制失效方法：将 key 中的 -v1 改为 -v2（restore-keys 仍可部分恢复旧缓存）
      - name: Cache HF model (.hf_cache)
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .hf_cache
          key: hf-cache-bge-large-zh-v1.5-${{ runner.os }}-v1
          # restore-keys 提供 fallback：key 未命中时按前缀恢复最近缓存，
          # 避免版本 bump 后完全重新下载（模型文件大概率相同）
          restore-keys: |
            hf-cache-bge-large-zh-v1.5-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r backend/requirements.txt
          pip install --no-cache-dir psutil

      # 首次运行 cache miss 时下载模型；cache hit 时此步秒级跳过
      - name: Download model (cache miss fallback)
        env:
          HF_HOME: ${{ github.workspace }}/.hf_cache
          HUGGINGFACE_HUB_CACHE: ${{ github.workspace }}/.hf_cache/hub
          HF_ENDPOINT: https://hf-mirror.com
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-large-zh-v1.5')"

      - name: Run dtype verification
        run: python scripts/verify-embedding-dtype.py

      - name: Alert on PR failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## ⚠️ Embedding dtype 健康检查失败（advisory，不阻塞）`,
              ``,
              `**PR**: #${prNumber} - ${context.payload.pull_request.title}`,
              `**失败 Job**: [embedding-health-check](${runUrl})`,
              ``,
              `### 可能原因`,
              `1. health 接口 dtype 上报逻辑回归（应如实报 float32，而非假报 float16）`,
              `2. 模型加载失败或路径变更`,
              `3. CI 环境模型下载超时`,
              ``,
              `### 修复指引`,
              `1. 本地复现：\`python scripts/verify-embedding-dtype.py\``,
              `2. 检查 \`backend/embedding_service.py\` 的 \`_model_actual_dtype\` 追踪逻辑`,
              `3. 确认 \`EMBEDDING_FP16=false\`（CPU 场景）`,
              ``,
              `<!-- auto-generated by embedding-health-check -->`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
