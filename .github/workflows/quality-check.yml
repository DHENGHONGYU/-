  #   - acl.fail-closed.test.ts (20 用例)：ACL 异常时 fail-closed 默认拒绝行为
  #   - databridgeAdapter.regression.test.ts (46 用例)：竞态条件 + 错误传播机制回归
  # 策略：阻塞性门禁（非 continue-on-error），任一失败即阻止 PR 合并
