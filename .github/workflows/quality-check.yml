name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# =============================================================================
# 安全配置 — 最小权限原则
# =============================================================================
# 默认只读权限，防止 workflow 误写仓库或泄露 secrets
permissions:
  contents: read
  security-events: write  # 用于上传审计结果到 GitHub Security

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHA pin 第三方 actions（防止供应链攻击：tag 可被重定向）
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d71f2d81a # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
      # --ignore-scripts: 禁止执行包安装脚本（防供应链攻击）
      # --no-audit: 跳过安装时审计（在单独 audit job 中执行）
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d71f2d81a # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      # 仅检查非测试文件的类型错误（阻塞 CI）
      - run: bash scripts/check-types.sh

  route-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d71f2d81a # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      - run: npx tsx scripts/verify-all-routes.ts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d71f2d81a # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      # 使用 test:clean 跳过 7 个已知失败测试（详见 package.json test:known 脚本）
      - run: npm run test:clean

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d71f2d81a # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      # 运行测试并生成覆盖率报告（跳过已知失败测试）
      # 覆盖率阈值定义在 vite.config.ts 的 test.coverage.thresholds
      - run: npm run test:ci
        env:
          CI: true
      # 上传覆盖率报告作为 artifact（供后续分析）
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d71f2d81a # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run audit:layers
      - run: npm run audit:hardcode
      - run: npm run audit:deadcode
      - run: npm run audit:docs
      - run: npm run lint:colors
      # npm audit: 检查依赖漏洞（audit-level=high 时 high/critical 才失败）
      - run: npm audit --audit-level=high
