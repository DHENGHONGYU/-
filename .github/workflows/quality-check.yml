  # ════════════════════════════════════════════════════════════════════════════
  # 视觉回归测试（EXPERIMENTAL — Docker 统一环境，逐步去实验性标志）
  # ════════════════════════════════════════════════════════════════════════════
  # 运行方式：通过 e2e/docker-compose.yml 启动 Playwright 官方容器
  #   - 容器内预装 Ubuntu + Chromium + 中文字体 → 消除 Windows/macOS 渲染差异
  #   - 基线真相源：本地运行 `npm run test:e2e:visual:docker:update` 后提交
  #   - CI 回归：运行 `npm run test:e2e:visual:docker` 做 diff
  #
  # 当前仍标记 continue-on-error: true，待收集 2-3 次 CI 稳定运行数据后移除。
  # ════════════════════════════════════════════════════════════════════════════
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 实验性：收集 Docker 方案稳定度，稳定后移除
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # 安装 Docker Compose（ubuntu-latest 已内置，显式确保版本）
      - name: Set up Docker
        uses: docker/setup-buildx-action@988b5a0280414a5213010198a302fdf5e5322a6c # v3.6.1
      # 构建并运行视觉回归
      - name: Build & run visual regression (Docker)
        run: |
          docker compose -f e2e/docker-compose.yml build visual-test
          docker compose -f e2e/docker-compose.yml run --rm visual-test
      # 上传失败截图（含 diff / actual / expected）便于调试
      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failures
          path: |
            test-results/
            e2e/visual-regression.spec.ts-snapshots/
          retention-days: 7
