  # 核心模块分支覆盖率门禁：src/core + src/lib 复杂逻辑分支
  # ════════════════════════════════════════════════════════════════════════════
  # 背景：project_memory.md 中 src/core 和 src/lib 未覆盖分支修复优先级清单
  # 覆盖（103 项用例）：
  #   - databridge.branch-coverage (8 项)：ACL 拒绝路径 + 非 Error 异常传播 + query 缺少 store
  #   - memoryCache.branch-coverage (16 项)：has() 过期检测 + deleteByPrefix + purgeExpired + 自动清理定时器 + createCache
  #   - routeGuard.branch-coverage (17 项)：storeName 白名单 + module 级 + crud 级 + 动态注册
  #   - safeCoerce.branch-coverage (24 项)：Symbol/object 分支 + bigint + 类数组对象
  #   - eventBus.branch-coverage (12 项)：unsubscribe 未注册回调 + 非 Error 异常隔离
  #   - withBroadcast.branch-coverage (11 项)：catch 块非 Error 的 String(err) 分支
  # 策略：阻塞性门禁，任一失败即阻止 PR 合并
  # 告警：失败时自动在 PR 上评论告警 + 上传 JUnit XML 报告 + main 分支创建 Issue
  # 设计依据：project_memory.md src/core + src/lib 未覆盖分支修复优先级
  core-lib-branch-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      - name: 核心模块分支覆盖率测试（src/core + src/lib，103 项用例）
        run: npm run test:branch:cov:ci
        env:
          CI: true
      - name: Upload JUnit XML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-lib-branch-junit-report
          path: reports/core-lib-branch-junit.xml
          retention-days: 30
      # ═══ 失败告警：自动在 PR 上评论，通知提交者 ═══
      - name: Alert on PR failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## ❌ 核心模块分支覆盖率门禁失败`,
              ``,
              `**提交者**: @${context.payload.pull_request.user.login}`,
              `**PR**: #${prNumber} - ${context.payload.pull_request.title}`,
              `**失败 Job**: [core-lib-branch-coverage](${runUrl})`,
              ``,
              `### 影响范围`,
              `分支覆盖率测试覆盖 196 项用例（11 个测试文件），包括：`,
              `- databridge (11 项)：ACL 拒绝路径 + 非 Error 异常传播 + P1 store 校验 + else 分支`,
              `- memoryCache (16 项)：过期清理 + LRU 淘汰 + 自动清理定时器`,
              `- routeGuard (17 项)：storeName 白名单 + module/crud 级权限`,
              `- safeCoerce (24 项)：Symbol/object 类型分支 + 边界值`,
              `- eventBus (12 项)：unsubscribe 未注册回调 + 非 Error 异常隔离`,
              `- withBroadcast (11 项)：catch 块非 Error 的 String(err) 分支`,
              `- batchQueue (8 项)：默认参数 + rejected 占位 + 空数组`,
              `- derivedCache (24 项)：缓存命中/未命中 + safeDivide + average 空数组`,
              `- databridgeAcl (19 项)：apiVersion undefined + assertQueryGetKey + assertAclWithFallback`,
              `- acl (20 项)：versioned override + storeOverrides + inferOperation + assert + wrap`,
              `- databridgeAdapter (19 项)：query 成功/超时/编程错误 + subscribe + 单例工厂`,
              ``,
              `### 修复指引`,
              `1. 下载 artifact \`core-lib-branch-junit-report\` 查看详细失败用例`,
              `2. 本地复现：\`npm run test:branch:cov\``,
              `3. 修复后重新推送，门禁将自动重跑`,
              ``,
              `<!-- auto-generated by core-lib-branch-coverage -->`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
      # ═══ 失败告警：非 PR 场景（如 main 分支推送）创建 Issue ═══
      - name: Alert on main branch failure (create issue)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitSha = context.payload.after.substring(0, 7);
            const body = [
              `## ❌ 核心模块分支覆盖率门禁失败（main 分支）`,
              ``,
              `**提交**: ${commitSha} - ${context.payload.head_commit.message.split('\n')[0]}`,
              `**触发者**: @${context.payload.pusher.name}`,
              `**失败 Job**: [core-lib-branch-coverage](${runUrl})`,
              ``,
              `### 影响范围`,
              `分支覆盖率测试覆盖 196 项用例（11 个测试文件），失败表明 src/core 或 src/lib 存在未覆盖的复杂逻辑分支回归。`,
              ``,
              `### 修复指引`,
              `1. 下载 artifact \`core-lib-branch-junit-report\` 查看详细失败用例`,
              `2. 本地复现：\`npm run test:branch:cov\``,
              `3. 修复后创建 hotfix PR 合并到 main`,
              ``,
              `<!-- auto-generated by core-lib-branch-coverage -->`
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[BRANCH-COV-GATE] 核心模块分支覆盖率门禁失败 - ${commitSha}`,
              body,
              labels: ['branch-cov-failure', 'bug'],
            });

