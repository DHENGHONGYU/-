name: Quality Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # 每日 03:17 深度审计（避开已有 03:00 A+H 字典刷新 / 03:10 Git 备份）
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# =============================================================================
# 安全配置 — 最小权限原则
# =============================================================================
# 默认只读权限，防止 workflow 误写仓库或泄露 secrets
permissions:
  contents: read
  security-events: write  # 用于上传审计结果到 GitHub Security

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHA pin 第三方 actions（防止供应链攻击：tag 可被重定向）
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      # --ignore-scripts: 禁止执行包安装脚本（防供应链攻击）
      # --no-audit: 跳过安装时审计（在单独 audit job 中执行）
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      # 真实 tsc:prod 门禁（原 scripts/check-types.sh 不存在 → 假绿灯，已修复为真实类型检查）
      - run: npm run tsc:prod

  route-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      - run: npx tsx scripts/verify-all-routes.ts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      # test:clean = 全量 vitest run（不跳过任何测试，失败即 CI 红）
      # 已知不稳定用例见 package.json test:known（单独运行观察，不在此排除）
      - run: npm run test:clean

  # ════════════════════════════════════════════════════════════════════════════
  # 行业 V4 图表 5 件套单元测试（P0 阻塞 — PR 合并强制门禁）
  # ════════════════════════════════════════════════════════════════════════════
  # 设计依据：docs/reference/implementation/chart-integration.md §7
  # 106 项用例覆盖 5 个组件：IndustryV4Panel / IndustryV4Radar / SubIndicatorBar
  # / TrendLineChart / ValuationDistribution（含 buildHistogram 纯函数）
  # 失败即阻塞 PR 合并；产出 JUnit XML 报告作为 artifact，失败时自动评论 PR/创建 Issue
  chart-industry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      # 1. 运行 5 件套测试（106 项用例，P0 阻塞），输出 JUnit XML 报告
      - name: Run chart industry tests (106 cases, P0 blocking)
        run: npm run test:chart:industry:ci
        env:
          CI: true
      # 2. 上传 JUnit XML 报告（保留 30 天供失败用例排查）
      - name: Upload JUnit XML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-industry-junit-report
          path: reports/chart-industry-junit.xml
          retention-days: 30
      # 3. 上传测试源文件（保留 14 天供 PR 调试）
      - name: Upload chart test source files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-industry-test-files
          path: src/components/chart/industry/
          retention-days: 14
      # ═══ 失败告警：自动在 PR 上评论，通知提交者 ═══
      - name: Alert on PR failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## ❌ 图表 5 件套门禁失败`,
              ``,
              `**提交者**: @${context.payload.pull_request.user.login}`,
              `**PR**: #${prNumber} - ${context.payload.pull_request.title}`,
              `**失败 Job**: [chart-industry-tests](${runUrl})`,
              ``,
              `### 影响范围`,
              `图表 5 件套测试覆盖 106 项用例，包括：`,
              `- IndustryV4Panel：行业面板组件`,
              `- IndustryV4Radar：雷达图组件`,
              `- SubIndicatorBar：子指标条形图`,
              `- TrendLineChart：趋势线图`,
              `- ValuationDistribution：估值分布图（含 buildHistogram）`,
              ``,
              `### 修复指引`,
              `1. 下载 artifact \`chart-industry-junit-report\` 查看详细失败用例`,
              `2. 本地复现：\`npm run test:chart:industry\``,
              `3. 修复后重新推送，门禁将自动重跑`,
              ``,
              `<!-- auto-generated by chart-industry-tests -->`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
      # ═══ 失败告警：非 PR 场景（如 main 分支推送）创建 Issue ═══
      - name: Alert on main branch failure (create issue)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitSha = context.payload.after.substring(0, 7);
            const body = [
              `## ❌ 图表 5 件套门禁失败（main 分支）`,
              ``,
              `**提交**: ${commitSha} - ${context.payload.head_commit.message.split('\n')[0]}`,
              `**触发者**: @${context.payload.pusher.name}`,
              `**失败 Job**: [chart-industry-tests](${runUrl})`,
              ``,
              `### 影响范围`,
              `图表 5 件套测试覆盖 106 项用例，失败表明图表组件存在回归。`,
              ``,
              `### 修复指引`,
              `1. 下载 artifact \`chart-industry-junit-report\` 查看详细失败用例`,
              `2. 本地复现：\`npm run test:chart:industry\``,
              `3. 修复后创建 hotfix PR 合并到 main`,
              ``,
              `<!-- auto-generated by chart-industry-tests -->`
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CHART-GATE] 图表 5 件套门禁失败 - ${commitSha}`,
              body,
              labels: ['chart-gate-failure', 'bug'],
            });

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      # 运行测试并生成覆盖率报告（全量，不跳过任何测试）
      # 覆盖率阈值定义在 vite.config.ts 的 test.coverage.thresholds
      - run: npm run test:ci
        env:
          CI: true
      # 上传覆盖率报告作为 artifact（供后续分析）
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      # Python 环境（doc-tier-validate.py 需要）
      - uses: actions/setup-python@0b93647e04c5672476a5b030e1f4e16f85c6f85f # v5.3.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit
      # P0 阻塞性检查（必须通过）
      - run: npm run audit:layers
      - run: npm run audit:hardcode
      # 文档门禁检查（P0 阻塞）— 8 项检查：frontmatter/tier/status/type/交叉引用/目录结构/编制规则/风格
      - name: Document gate (P0 blocking — 8 checks)
        run: npm run doc:gate
        continue-on-error: false
      # 文档同步审计 — 阻断性门禁（exit code 非零则 CI 失败）
      - name: Documentation sync audit (P0 blocking gate)
        run: npm run audit:docs
        continue-on-error: false
      # 文档-代码交叉引用断裂率门禁 — 阈值 0.5%（P0 阻塞）
      - name: Documentation cross-reference broken rate gate (P0 blocking)
        run: npm run doc:crossref:audit -- --max-broken-rate=0.5%
        continue-on-error: false
      # 文档-代码双向完整性审计 — 非阻塞，先积累基线数据
      - name: Documentation-Code integrity audit (baseline collection)
        run: npm run audit:doc-integrity
        continue-on-error: true
      - name: Upload doc-integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-integrity-report
          path: docs/reports/audit/audit-doc-integrity-*.json
          retention-days: 7
      - name: Semantic validation (P0 blocking gate)
        run: npm run audit:semantic
        continue-on-error: false
      - run: npm run lint:colors
      # npm audit: 检查依赖漏洞（audit-level=high 时 high/critical 才失败）
      - run: npm audit --audit-level=high

  # 依赖分析：检测循环依赖、孤立模块、不可达模块
  dependency-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      # P1 重要检查：循环依赖为错误级别会阻止合并
      - name: Run dependency analysis (P1 important check)
        run: npm run audit:dependencies
      # 上传依赖分析报告
      - name: Upload dependency analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-analysis-report
          path: docs/reports/dependency-analysis.*
          retention-days: 7

  # 质量门禁汇总：汇总所有检查结果并生成报告
  pre-push-hook-gate:         # pre-push 钩子 scope 校验回归测试（main/develop/PR 必检）
    name: Pre-push hook scope validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Run pre-push hook simulation (shell, 2 scenarios)
        run: sh scripts/audit/simulate-pre-push-blocking.sh
      - name: Run pre-push hook CI regression (Node.js, 18 scenarios)
        run: node scripts/audit/ci-pre-push-regression.mjs
        env:
          SH_BIN: sh
      - name: Upload pre-push hook test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-push-hook-logs
          path: .tmp/logs/pre-push.log
          retention-days: 7

  quality-gate-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, typecheck, route-verify, test, chart-industry-tests, audit, dependency-analysis, databridge-integrity, bootstrap-p0-gate, p0-core-gate, pre-push-hook-gate]
    if: always()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      # 统一量化质量门禁聚合（SonarQube 式加权质量分 + 趋势基线，非阻塞报告）
      - name: Unified quality gate aggregate (non-blocking report)
        continue-on-error: true
        run: npm run gate:aggregate -- --json
      - name: Generate quality gate summary
        run: |
          echo "=== 质量门禁检查汇总 ==="
          echo "P0 阻塞性检查:"
          echo "  - lint: ${{ needs.lint.result }}"
          echo "  - typecheck: ${{ needs.typecheck.result }}"
          echo "  - route-verify: ${{ needs.route-verify.result }}"
          echo "  - test: ${{ needs.test.result }}"
          echo "  - chart-industry-tests (5 件套图表组件): ${{ needs.chart-industry-tests.result }}"
          echo "  - audit (P0 checks): ${{ needs.audit.result }}"
          echo "  - databridge-integrity: ${{ needs.databridge-integrity.result }}"
          echo "  - bootstrap-p0-gate (种子数据 + 内存降级): ${{ needs.bootstrap-p0-gate.result }}"
          echo "  - p0-core-gate (cascadeExecutor + databridgeAdapter + acl fail-closed + 回归测试，141 项用例): ${{ needs.p0-core-gate.result }}"
          echo "  - pre-push-hook-gate (scope 校验 + 边界容错，30 项用例): ${{ needs.pre-push-hook-gate.result }}"
          echo ""
          echo "P1 重要检查:"
          echo "  - dependency-analysis: ${{ needs.dependency-analysis.result }}"
          echo ""
          echo "P2 建议性检查（在单独的 workflow 中执行）"
      - name: Check P0 gate status
        run: |
          FAILURE=false
          
          if [ "${{ needs.lint.result }}" != "success" ] && [ "${{ needs.lint.result }}" != "skipped" ]; then
            echo "❌ P0 检查失败: lint"
            FAILURE=true
          fi
          
          if [ "${{ needs.typecheck.result }}" != "success" ] && [ "${{ needs.typecheck.result }}" != "skipped" ]; then
            echo "❌ P0 检查失败: typecheck"
            FAILURE=true
          fi
          
          if [ "${{ needs.route-verify.result }}" != "success" ] && [ "${{ needs.route-verify.result }}" != "skipped" ]; then
            echo "❌ P0 检查失败: route-verify"
            FAILURE=true
          fi
          
          if [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ]; then
            echo "❌ P0 检查失败: test"
            FAILURE=true
          fi
          
          if [ "${{ needs.chart-industry-tests.result }}" != "success" ] && [ "${{ needs.chart-industry-tests.result }}" != "skipped" ]; then
            echo "❌ P0 检查失败: chart-industry-tests (5 件套图表组件 106 项用例)"
            FAILURE=true
          fi
          
          if [ "${{ needs.audit.result }}" != "success" ] && [ "${{ needs.audit.result }}" != "skipped" ]; then
            echo "❌ P0 检查失败: audit"
            FAILURE=true
          fi
          
          if [ "${{ needs.databridge-integrity.result }}" != "success" ] && [ "${{ needs.databridge-integrity.result }}" != "skipped" ]; then
            echo "❌ P0 检查失败: databridge-integrity"
            FAILURE=true
          fi
          
          if [ "${{ needs.bootstrap-p0-gate.result }}" != "success" ] && [ "${{ needs.bootstrap-p0-gate.result }}" != "skipped" ]; then
            echo "❌ P0 检查失败: bootstrap-p0-gate (种子数据初始化+重试 / 编排容错 / 内存降级模式)"
            FAILURE=true
          fi

          if [ "${{ needs.p0-core-gate.result }}" != "success" ] && [ "${{ needs.p0-core-gate.result }}" != "skipped" ]; then
            echo "❌ P0 检查失败: p0-core-gate (cascadeExecutor + databridgeAdapter + acl fail-closed + 回归测试，141 项用例)"
            FAILURE=true
          fi

          if [ "${{ needs.pre-push-hook-gate.result }}" != "success" ] && [ "${{ needs.pre-push-hook-gate.result }}" != "skipped" ]; then
            echo "❌ P0 检查失败: pre-push-hook-gate (scope 校验 + 边界容错，30 项用例)"
            FAILURE=true
          fi

          if [ "$FAILURE" = true ]; then
            exit 1
          else
            echo "✅ 所有 P0 阻塞性检查通过"
          fi

  # 契约验证：验证所有类型契约的运行时合规性
  contract-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      - name: Run contract validation tests
        run: npm run test:clean -- --reporter=verbose
        env:
          CI: true
          CONTRACT_VALIDATION_LOG: true

  # DataBridge 完整性：验证数据流转、ACL 权限、启动日志的端到端正确性
  # 策略：阻塞性门禁（非 continue-on-error），任一失败即阻止 PR 合并
  # 告警：失败时自动在 PR 上评论告警 + 上传 JUnit XML 报告 + main 分支创建 Issue
  databridge-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      - name: DataBridge 完整性测试（数据流转 + bootstrapService + ACL，52 项用例）
        run: npm run test:databridge:gate:ci
        env:
          CI: true
      - name: Upload JUnit XML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: databridge-integrity-junit-report
          path: reports/databridge-integrity-junit.xml
          retention-days: 30
      - name: Upload DataBridge test source files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: databridge-integrity-test-files
          path: |
            src/services/execution/executionPlanService.dataflow.test.ts
            src/services/system/bootstrapService.test.ts
            src/core/acl.test.ts
            src/core/acl.system-dimension.test.ts
            src/core/acl.defensive.test.ts
          retention-days: 14
      # ═══ 失败告警：自动在 PR 上评论，通知提交者 ═══
      - name: Alert on PR failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## ❌ DataBridge 完整性门禁失败`,
              ``,
              `**提交者**: @${context.payload.pull_request.user.login}`,
              `**PR**: #${prNumber} - ${context.payload.pull_request.title}`,
              `**失败 Job**: [databridge-integrity](${runUrl})`,
              ``,
              `### 影响范围`,
              `DataBridge 完整性测试覆盖 52 项用例，包括：`,
              `- executionPlanService 数据流转（34 项）：集成测试`,
              `- bootstrapService 启动日志（13 项）：单元测试`,
              `- ACL 矩阵配置（5 项）：契约测试`,
              ``,
              `### 修复指引`,
              `1. 下载 artifact \`databridge-integrity-junit-report\` 查看详细失败用例`,
              `2. 本地复现：\`npm run test:databridge:gate\``,
              `3. 修复后重新推送，门禁将自动重跑`,
              ``,
              `<!-- auto-generated by databridge-integrity -->`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
      # ═══ 失败告警：非 PR 场景（如 main 分支推送）创建 Issue ═══
      - name: Alert on main branch failure (create issue)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitSha = context.payload.after.substring(0, 7);
            const body = [
              `## ❌ DataBridge 完整性门禁失败（main 分支）`,
              ``,
