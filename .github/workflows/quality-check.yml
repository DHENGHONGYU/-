name: Quality Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation
        run: npm run tsc

      - name: JSON validation
        run: npm run validate:json

      - name: ESLint check
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pitfall rules check
        run: |
          echo "============================================================"
          echo "踩坑规则门禁检查（规则 #11-#14）"
          echo "============================================================"
          python scripts/pitfall_check.py python/ || {
            echo ""
            echo "❌ 踩坑规则检查未通过，阻止 CI/CD 流水线"
            exit 1
          }

      - name: Unit tests
        run: npm run test

      - name: Data blueprint validation
        run: npm run validate:blueprint