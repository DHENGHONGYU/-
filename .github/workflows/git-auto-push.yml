# Git Auto-Push (Network Recovery) — 仅手动触发
# 改造说明（2026-08-03）：
#   - 移除 schedule: cron（原每 5 分钟触发，过于频繁）
#   - 移除 push 触发（与 ci.yml 重复）
#   - 移除 Pester 测试 job（不属于推送工作流职责）
#   - runner 从 windows-latest 改为 ubuntu-latest（降 10 倍 CI 成本）
#   - 仅保留 workflow_dispatch 用于网络恢复后手动触发推送
#   详见: docs/ops/backup-governance.md §三/§四
name: Git Auto-Push (Network Recovery)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch to push'
        required: true
        default: 'main'
      tag:
        description: 'Tag to push (optional)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: git-auto-push
  cancel-in-progress: true

jobs:
  auto-push:
    name: 'Push to Remote'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push branch
        shell: bash
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          echo "Pushing branch: $BRANCH"
          git push origin "$BRANCH"

      - name: Push tag (if specified)
        if: github.event.inputs.tag != ''
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          echo "Pushing tag: $TAG"
          git push origin "$TAG"

      - name: Verify sync
        shell: bash
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          echo "=== Sync status ==="
          git rev-list --left-right --count "origin/${BRANCH}...HEAD" 2>/dev/null || echo "Cannot determine sync status"
