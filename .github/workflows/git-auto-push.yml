name: Git Auto-Push (Network Recovery)

on:
  workflow_dispatch:
    inputs:
      repo_path:
        description: 'Repository path (default: workspace)'
        required: false
        default: ''
      branch:
        description: 'Target branch'
        required: true
        default: 'feat/cross-index-20260719'
      tag:
        description: 'Tag to push (optional)'
        required: false
        default: 'v2.6.0'
      check_interval:
        description: 'Network check interval in seconds'
        required: false
        default: '10'
      max_retries:
        description: 'Max network check attempts (0 = infinite)'
        required: false
        default: '0'
      push_retries:
        description: 'Push retry count'
        required: false
        default: '3'
      mode:
        description: 'Operation mode'
        required: false
        default: 'push'
        type: choice
        options:
          - push
          - test
          - verify

  schedule:
    - cron: '*/5 * * * *'

  push:
    branches: ['feat/**', 'feature/**']
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  test:
    name: 'Pester Tests (GitAutoPush Module)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = ".workbuddy\tests\GitAutoPush.Tests.ps1"
          $config.Output.Verbosity = "Detailed"
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = ".workbuddy\tests\testResults.xml"
          $config.TestResult.OutputFormat = "NUnitXml"
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-autopush-test-results
          path: |
            .workbuddy/tests/testResults.xml
          retention-days: 7

  auto-push:
    name: 'Network Recovery Auto-Push'
    needs: test
    if: github.event_name != 'push' || (github.event_name == 'push' && needs.test.result == 'success')
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GIT_AUTOPUSH_LOG: '.workbuddy\git-auto-push-ci.log'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect pending changes
        id: detect
        shell: pwsh
        run: |
          Import-Module ".workbuddy\scripts\GitAutoPush.psm1"

          $branch = "${{ github.event.inputs.branch }}"
          if (-not $branch) { $branch = "feat/cross-index-20260719" }

          $repoPath = "${{ github.event.inputs.repo_path }}"
          if (-not $repoPath) { $repoPath = $env:GITHUB_WORKSPACE }

          Write-GitLog "Checking pending changes for branch: $branch" 'INFO' $env:GIT_AUTOPUSH_LOG

          $pending = Get-PendingCommits -RepoPath $repoPath -Branch $branch -LogFile $env:GIT_AUTOPUSH_LOG
          $tag = "${{ github.event.inputs.tag }}"
          $tagNeedsPush = $false
          if ($tag) {
            $tagNeedsPush = Test-TagNeedsPush -RepoPath $repoPath -Tag $tag -LogFile $env:GIT_AUTOPUSH_LOG
          }

          $hasWork = ($pending -and $pending.Count -gt 0) -or $tagNeedsPush
          Write-GitLog "Has pending work: $hasWork" 'INFO' $env:GIT_AUTOPUSH_LOG

          echo "has_work=$($hasWork.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          echo "pending_count=$($pending.Count)" >> $env:GITHUB_OUTPUT
          echo "tag_needs_push=$($tagNeedsPush.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Check network connectivity
        id: network
        shell: pwsh
        run: |
          Import-Module ".workbuddy\scripts\GitAutoPush.psm1"
          $connected = Test-GitNetwork -HostName 'github.com' -Port 443 -TimeoutSeconds 10
          Write-GitLog "GitHub connectivity: $connected" 'INFO' $env:GIT_AUTOPUSH_LOG
          echo "connected=$($connected.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Execute auto-push
        if: steps.detect.outputs.has_work == 'true' && steps.network.outputs.connected == 'true'
        shell: pwsh
        run: |
          Import-Module ".workbuddy\scripts\GitAutoPush.psm1"

          $repoPath = "${{ github.event.inputs.repo_path }}"
          if (-not $repoPath) { $repoPath = $env:GITHUB_WORKSPACE }

          $branch = "${{ github.event.inputs.branch }}"
          if (-not $branch) { $branch = "feat/cross-index-20260719" }

          $tag = "${{ github.event.inputs.tag }}"
          $checkInterval = [int]("${{ github.event.inputs.check_interval }}")
          if ($checkInterval -le 0) { $checkInterval = 10 }

          $pushRetries = [int]("${{ github.event.inputs.push_retries }}")
          if ($pushRetries -le 0) { $pushRetries = 3 }

          Write-GitLog "Starting auto-push workflow..." 'INFO' $env:GIT_AUTOPUSH_LOG
          Write-GitLog "  Repo: $repoPath" 'INFO' $env:GIT_AUTOPUSH_LOG
          Write-GitLog "  Branch: $branch" 'INFO' $env:GIT_AUTOPUSH_LOG
          if ($tag) { Write-GitLog "  Tag: $tag" 'INFO' $env:GIT_AUTOPUSH_LOG }

          $exitCode = Invoke-AutoPush `
            -RepoPath $repoPath `
            -Branch $branch `
            -Tag $tag `
            -CheckIntervalSeconds $checkInterval `
            -MaxRetries 1 `
            -PushRetries $pushRetries `
            -PushRetryDelaySeconds 2 `
            -LogFile $env:GIT_AUTOPUSH_LOG

          Write-GitLog "Auto-push completed with exit code: $exitCode" 'INFO' $env:GIT_AUTOPUSH_LOG
          exit $exitCode

      - name: Verify remote sync
        if: steps.detect.outputs.has_work == 'true' && steps.network.outputs.connected == 'true'
        shell: pwsh
        run: |
          Import-Module ".workbuddy\scripts\GitAutoPush.psm1"

          $repoPath = "${{ github.event.inputs.repo_path }}"
          if (-not $repoPath) { $repoPath = $env:GITHUB_WORKSPACE }

          $branch = "${{ github.event.inputs.branch }}"
          if (-not $branch) { $branch = "feat/cross-index-20260719" }

          $tag = "${{ github.event.inputs.tag }}"

          $synced = Test-RemoteSync -RepoPath $repoPath -Branch $branch -Tag $tag -LogFile $env:GIT_AUTOPUSH_LOG

          if ($synced) {
            Write-GitLog "Verification: fully synced" 'SUCCESS' $env:GIT_AUTOPUSH_LOG
          } else {
            Write-GitLog "Verification: sync may be incomplete" 'WARN' $env:GIT_AUTOPUSH_LOG
          }

      - name: Notify network unavailable
        if: steps.network.outputs.connected != 'true'
        shell: pwsh
        run: |
          Write-GitLog "GitHub is unreachable from CI environment" 'WARN' $env:GIT_AUTOPUSH_LOG
          Write-GitLog "Network check will be retried by scheduler or next workflow run" 'INFO' $env:GIT_AUTOPUSH_LOG

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-autopush-logs
          path: |
            .workbuddy/git-auto-push-ci.log
          retention-days: 30

  verify-only:
    name: 'Verify Sync Status (dry-run)'
    if: github.event.inputs.mode == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check sync status
        shell: bash
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          TAG="${{ github.event.inputs.tag }}"
          echo "Branch: $BRANCH"
          echo "Tag: $TAG"
          echo ""
          echo "=== Pending commits ==="
          git log "origin/$BRANCH..HEAD" --oneline 2>/dev/null || echo "Cannot fetch remote"
          echo ""
          echo "=== Tag status ==="
          if [ -n "$TAG" ]; then
            echo "Local tag:"
            git rev-parse "$TAG" 2>/dev/null || echo "  Not found locally"
            echo "Remote tag:"
            git rev-parse "origin/$TAG" 2>/dev/null || echo "  Not found on remote"
          fi
          echo ""
          echo "=== Sync status ==="
          git rev-list --left-right --count "origin/$BRANCH...HEAD" 2>/dev/null || echo "Cannot determine sync status"
