name: Doc Automation

# 文档自动更新流水线（T7b）— push/PR 触发，按映射表检测文档同步状态
# 关联：docs/00-meta/doc-trigger-action-map.md（触发-动作映射）、scripts/doc-update-trigger.ts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  doc-sync:
    name: Document sync detection & audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHA pin 第三方 actions（防止供应链攻击：tag 可被重定向）
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # 需要完整历史以支持 git diff（doc-update-trigger / doc-auto-updater 依赖变更检测）
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d71f2d81a # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
      # --ignore-scripts: 禁止执行包安装脚本（防供应链攻击）
      - run: npm ci --ignore-scripts --no-audit

      # 1. 检测代码变更触发的文档更新规则（信息性，非阻塞）
      #    输出哪些触发事件命中、对应需更新的文档清单
      - name: Detect doc update triggers
        run: npx tsx scripts/doc-update-trigger.ts --check
        continue-on-error: true

      # 2. dry-run 验证文档同步（非阻塞，生成报告供审阅）
      #    --skip-crossref/--skip-version-history：CI 仅做差异检测，不写文档
      - name: Doc auto-update dry-run
        run: npx tsx scripts/doc-auto-updater.ts --dry-run --skip-crossref --skip-version-history
        continue-on-error: true

      # 3. 文档同步审计（P0 阻塞门禁 — exit code 非零则 CI 失败）
      - name: Documentation sync audit (P0 blocking gate)
        run: npm run audit:docs
        continue-on-error: false

      # 4. 文档-代码双向完整性审计（P1，非阻塞，生成报告供审阅）
      - name: Documentation-Code integrity audit (P1)
        run: npm run audit:doc-integrity
        continue-on-error: true

      # 5. frontmatter code_version 校验（P1，非阻塞）
      - name: Doc version check (P1)
        run: npm run doc:version-check
        continue-on-error: true

      # 上传 doc-auto-update + doc-integrity 报告作为 artifact（供后续分析）
      - name: Upload doc reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-auto-update-report
          path: |
            docs/reports/doc-auto-update/
            docs/reports/audit/audit-doc-integrity-*.json
          retention-days: 7
