name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.0.0-rc.1)'
        required: true
        default: 'v2.0.0-rc.1'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '20'

jobs:
  build:
    name: Build Windows NSIS Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node dependencies
        run: npm ci

      - name: Create Python venv & install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r backend/requirements.txt
          .venv\Scripts\python.exe -m pip install pyinstaller

      - name: Build Python Sidecar (PyInstaller)
        run: npm run sidecar:build

      - name: Build Electron App (NSIS)
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinSightV9-Setup-${{ github.ref_name || github.event.inputs.version }}
          path: release/FinSightV9 Setup *.exe
          if-no-files-found: error

      - name: Upload sidecar log artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/v9-sidecar/v9_sidecar/warn-*.txt
            build/v9-sidecar/v9_sidecar/xref-*.html

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          name: FinSightV9 ${{ github.ref_name || github.event.inputs.version }}
          body_path: docs/release-notes/RELEASE-NOTES.md
          draft: true
          prerelease: ${{ contains(github.ref_name || github.event.inputs.version, 'rc') || contains(github.ref_name || github.event.inputs.version, 'beta') }}
          files: |
            release/FinSightV9 Setup *.exe
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
