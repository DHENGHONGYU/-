name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.0.0-rc.1)'
        required: true
        default: 'v2.0.0-rc.1'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '22'

jobs:
  build:
    name: Build Windows NSIS Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node dependencies
        run: npm ci

      - name: Create Python venv & install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          # 先单独安装 CPU 版本 torch（避免从 PyPI 拉取 2GB+ CUDA 包导致超时）
          .venv\Scripts\python.exe -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          .venv\Scripts\python.exe -m pip install -r backend/requirements.txt
          .venv\Scripts\python.exe -m pip install pyinstaller

      - name: Build Python Sidecar (PyInstaller)
        run: npm run sidecar:build

      - name: Build Electron App (NSIS)
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@b4b15b8c7c695131ce0f3a21bb6e049c944092a6 # v4.4.3
        with:
          name: FinSightV9-Setup-${{ github.ref_name || github.event.inputs.version }}
          path: release/FinSightV9 Setup *.exe
          if-no-files-found: error

      - name: Upload sidecar log artifact
        uses: actions/upload-artifact@b4b15b8c7c695131ce0f3a21bb6e049c944092a6 # v4.4.3
        with:
          name: build-logs
          path: |
            build/v9-sidecar/v9_sidecar/warn-*.txt
            build/v9-sidecar/v9_sidecar/xref-*.html

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@69320dbe05506a9a39fc8ae11030b214ec2d1f87 # v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          name: FinSightV9 ${{ github.ref_name || github.event.inputs.version }}
          body_path: docs/release-notes/RELEASE-NOTES.md
          draft: true
          prerelease: ${{ contains(github.ref_name || github.event.inputs.version, 'rc') || contains(github.ref_name || github.event.inputs.version, 'beta') }}
          files: |
            release/FinSightV9 Setup *.exe
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
