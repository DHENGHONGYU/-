name: Archive Maintenance (Weekly)

on:
  schedule:
    - cron: "0 3 * * MON"  # Every Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Retention period in days (default: 30)"
        required: false
        default: "30"
      execute:
        description: "Actually delete expired batches (unchecked = dry-run)"
        required: false
        default: "false"

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.14'
  RETENTION_DAYS: ${{ inputs.retention_days || '30' }}

jobs:
  archive-run:
    name: Archive outputs/ and generate manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run outputs archive
        run: npm run archive:run
        continue-on-error: true

      - name: Upload outputs artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-outputs-${{ github.run_id }}
          path: archive/outputs/
          retention-days: ${{ env.RETENTION_DAYS }}

  archive-cleanup:
    name: Cleanup expired batches and generate timeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: archive-run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download archive artifacts
        uses: actions/download-artifact@v4
        with:
          name: archive-outputs-${{ github.run_id }}
          path: archive/outputs/
        continue-on-error: true

      - name: Archive cleanup
        run: |
          if [ "${{ inputs.execute }}" = "true" ]; then
            echo "=== EXECUTE MODE: Deleting batches older than $RETENTION_DAYS days ==="
            npm run archive:cleanup -- --days $RETENTION_DAYS
          else
            echo "=== DRY-RUN MODE (set execute=true to actually delete) ==="
            npm run archive:cleanup:dry -- --days $RETENTION_DAYS
          fi

      - name: Generate timeline
        run: npm run archive:timeline

      - name: Upload timeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-timeline-${{ github.run_id }}
          path: |
            archive/_archive-timeline.json
            archive/ARCHIVE-TIMELINE-REPORT.md
          retention-days: 90

      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-manifest-${{ github.run_id }}
          path: archive/outputs/*-archive/_archive-manifest.json
          retention-days: 90

      - name: Summary
        run: |
          echo "## Archive Maintenance Summary"
          echo ""
          echo "- **Retention**: $RETENTION_DAYS days"
          echo "- **Execute mode**: ${{ inputs.execute || 'false' }} (dry-run if false)"
          echo "- **Workflow run**: ${{ github.run_id }}"
          echo ""
          echo "Artifacts: archive-outputs, archive-timeline, archive-manifest"
