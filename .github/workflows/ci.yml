# .github/workflows/ci.yml
# 开发分支（feat/**）精益门禁：快反馈，不阻塞主分支全量 CI（quality-check.yml 负责 main/develop）
# 设计依据：outputs/dev-remediation-roadmap-2026-07-23.md §P1-C（优秀案例基准校对后的修正设计）
name: CI (dev branches)

on:
  push:
    branches: ['feat/**', 'feature/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:                      # 快反馈门禁（typecheck + build）
    name: Smoke (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SHA pin 第三方 actions（防供应链攻击，与 quality-check.yml 一致）
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
      # build 需要 esbuild 原生二进制，故不使用 --ignore-scripts
      - name: Fix npm registry for CI (npmmirror → npmjs)
        run: sed -i 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' package-lock.json
      - name: Build local @finsightv9/safe-format
        run: cd packages/safe-format && npm install --no-audit && npm run build && cd ../..
      - run: npm install --no-audit
      - name: Type check (tsc:prod)
        run: npm run tsc:prod
      - name: Production build
        run: npm run build

  test:                       # 测试 + 覆盖率（Phase2：阈值未达标即阻断）
    name: Test + coverage (Phase2 threshold gate)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Fix npm registry for CI (npmmirror → npmjs)
        run: sed -i 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' package-lock.json
      - name: Build local @finsightv9/safe-format
        run: cd packages/safe-format && npm install --no-audit && npm run build && cd ../..
      - run: npm install --no-audit
      # Phase2: 覆盖率阈值正式阻断 — 未达标即 FAIL
      # 阈值定义见 vite.config.ts coverage.thresholds (src/core/data/lib/services/components/hooks/pages 七级)
      - name: Unit tests + coverage (Phase2 threshold gate)
        run: npm run test:ci
        env:
          CI: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c695131ce0f3a21bb6e049c944092a6 # v4.4.3
        with:
          name: dev-coverage-report
          path: coverage/
          retention-days: 7

  chart-industry-tests:       # 5 件套图表组件测试（feat 分支早反馈，强制阻塞）
    name: Chart industry tests (5-piece, P0 blocking)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Fix npm registry for CI (npmmirror → npmjs)
        run: sed -i 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' package-lock.json
      - name: Build local @finsightv9/safe-format
        run: cd packages/safe-format && npm install --no-audit && npm run build && cd ../..
      - run: npm install --no-audit
      - name: Run chart industry tests (106 cases)
        run: npm run test:chart:industry
        env:
          CI: true
      - name: Generate HTML report
        if: always()
        run: npm run report:chart
      - name: Upload chart test report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c695131ce0f3a21bb6e049c944092a6 # v4.4.3
        with:
          name: dev-chart-industry-test-report
          path: |
            outputs/test-results/chartTests.json
            outputs/test-results/chart-report.html
          retention-days: 7

  bootstrap-p0-gate:          # P0 强制门禁：种子数据重试 + 内存降级（开发分支必检，阻塞）
    name: Bootstrap P0 gate (seed retry + memory fallback)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Fix npm registry for CI (npmmirror → npmjs)
        run: sed -i 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' package-lock.json
      - name: Build local @finsightv9/safe-format
        run: cd packages/safe-format && npm install --no-audit && npm run build && cd ../..
      - run: npm install --no-audit --ignore-scripts --no-audit
      - name: P0-1 种子数据重试 + P0-2 内存降级模式
        run: npm run test:bootstrap:p0
        env:
          CI: true
      - name: Upload bootstrap P0 test report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c695131ce0f3a21bb6e049c944092a6 # v4.4.3
        with:
          name: dev-bootstrap-p0-test-report
          path: |
            src/services/system/bootstrapService.test.ts
          retention-days: 7

  layers:                     # 快边界审计留开发分支 PR/推送
    name: Layer boundary audit
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Fix npm registry for CI (npmmirror → npmjs)
        run: sed -i 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' package-lock.json
      - name: Build local @finsightv9/safe-format
        run: cd packages/safe-format && npm install --no-audit && npm run build && cd ../..
      - run: npm install --no-audit
      - name: audit:layers (禁止跨层调用)
        run: npm run audit:layers

  registry-gate:              # 四层注册表治理 · 自动化回归守护（开发分支推送必检，阻塞 PR）
    name: Registry governance gate
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write   # PR 失败自动评论需要；不写默认 read 会 403 静默失败

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0      # 给未来条目数基线对比（增长 vs 突变）留 git 历史

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      # 与 smoke/test/layers 等所有 job 保持一致：sed 切 npmmirror → npmjs 否则 CI install 超时/404
      - name: Fix npm registry for CI (npmmirror → npmjs)
        run: sed -i 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' package-lock.json

      # workspace 依赖：safe-format 必须先构建
      - name: Build local @finsightv9/safe-format
        run: cd packages/safe-format && npm install --no-audit && npm run build && cd ../..

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ------------------------------------------------------------------
      # 核心守护：JSON 模式执行 → 结构化报告方便 Artifact + 评论脚本解析
      # 失败时先 cat 报告再 exit 1：确保 PR 页面 Actions log 里能直接看到
      # failures 内容，而不是只能看到一句 "Process completed with exit code 1"
      # ------------------------------------------------------------------
      - name: audit:registry:regression (四层注册表回归守护)
        id: registry_guard
        run: |
          mkdir -p outputs
          npm run audit:registry:regression:json > outputs/registry-regression.json 2>&1 \
            && cat outputs/registry-regression.json \
            || ( \
              echo 'REGISTRY-GATE FAILED. Report:'; \
              cat outputs/registry-regression.json; \
              exit 1 \
            )

      - name: Upload registry regression report artifact
        uses: actions/upload-artifact@b4b15b8c7c695131ce0f3a21bb6e049c944092a6 # v4.4.3
        with:
          name: dev-registry-gate-report
          path: outputs/registry-regression.json
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------------
      # 仅 PR + job 失败时：自动在 PR 评论结构化 failures 列表
      #   * 用 HTML 注释 tag 做幂等：同一个 PR 多次 push，每次覆盖同一条评论
      #     （避免 10 次 push → 10 条相同警报评论，没人看）
      #   * Artifact 也会同时上传，给下游脚本做长期趋势分析
      # ------------------------------------------------------------------
      - name: Alert on PR failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'outputs', 'registry-regression.json');
            let report = { failures: [], warnings: [], allPassed: false };
            try {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            } catch (e) {
              report.parseError = String(e && e.message || e);
            }
            const fmt = (arr, emoji) => Array.isArray(arr) && arr.length
              ? arr.map(x => `  ${emoji} \`${String(x).replace(/`/g, "'")}\``).join('\n')
              : '  _(空)_';
            const sha8 = (context.sha || 'unknown').substring(0, 8);
            const body =
              '## 🗂️ 四层注册表治理门 · 拦截报告 🔴\n' +
              '> job: **registry-gate** · 触发事件: `pull_request` · commit: `' + sha8 + '`\n\n' +
              '### 阻塞级回归（' + (report.failures?.length ?? 0) + ' 条）\n' +
              fmt(report.failures, '⛔') + '\n\n' +
              '### 非阻塞警告（' + (report.warnings?.length ?? 0) + ' 条）\n' +
              fmt(report.warnings, '⚠️') + '\n\n' +
              (report.counts
                ? '### 条目数快照\n' +
                  '| Store | Service | Component | ComponentSubRegistries |\n' +
                  '|------:|--------:|----------:|-----------------------:|\n' +
                  '| ' + report.counts.storeEntries + ' | ' + report.counts.serviceEntries + ' | ' +
                    report.counts.componentEntries + ' | ' + (report.baseline?.componentSubRegistries ?? '—') + ' |\n\n'
                : '') +
              '📄 完整 JSON 报告：见本次 Run 的 Artifact **dev-registry-gate-report** → `outputs/registry-regression.json`\n\n' +
              '---\n<sub>修复指南：`docs/reference/changelogs/2026-08/registry-governance-summary.md` §2 脚本重构 / §4 新增校验 / §7 SOP / §10 教训</sub>';
            const tag = '<!-- registry-gate-report-tag:v1 -->';
            const finalBody = tag + '\n' + body;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: existing } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const mine = existing.find(c => c.body && c.body.includes(tag) && c.user && (c.user.type === 'Bot' || c.user.login === 'github-actions[bot]'));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: finalBody });
              core.info('[registry-gate] updated previous comment, id=' + mine.id);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: finalBody });
              core.info('[registry-gate] created new alert comment on PR #' + issue_number);
            }

  databridge-gate:           # DataBridge 完整性快速门禁（开发分支必检，不阻塞推送）
    name: DataBridge integrity gate
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Fix npm registry for CI (npmmirror → npmjs)
        run: sed -i 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' package-lock.json
      - name: Build local @finsightv9/safe-format
        run: cd packages/safe-format && npm install --no-audit && npm run build && cd ../..
      - run: npm install --no-audit
      - name: DataBridge 数据流转 + bootstrapService + ACL 完整性检查
        run: npm run test:databridge:gate
        env:
          CI: true

  p0-core-gate:              # P0 核心模块门禁（开发分支必检，阻塞推送）
    name: P0 core gate (cascade + databridgeAdapter + acl fail-closed + regression)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Fix npm registry for CI (npmmirror → npmjs)
        run: sed -i 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' package-lock.json
      - name: Build local @finsightv9/safe-format
        run: cd packages/safe-format && npm install --no-audit && npm run build && cd ../..
      - run: npm install --no-audit
      - name: P0 核心模块测试（cascadeExecutor + databridgeAdapter + acl fail-closed + 回归测试，141 项用例）
        run: npm run test:p0:core:ci
        env:
          CI: true
      - name: Upload JUnit XML test report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c695131ce0f3a21bb6e049c944092a6 # v4.4.3
        with:
          name: dev-p0-core-junit-report
          path: reports/p0-core-junit.xml
          retention-days: 14
      - name: Upload P0 core test source files
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c695131ce0f3a21bb6e049c944092a6 # v4.4.3
        with:
          name: dev-p0-core-test-files
          path: |
            src/core/cascadeExecutor.test.ts
            src/core/databridgeAdapter.test.ts
            src/core/acl.fail-closed.test.ts
            src/core/databridgeAdapter.regression.test.ts
          retention-days: 7
      # ═══ 失败告警：自动在 PR 上评论（feat/fix 分支） ═══
      - name: Alert on PR failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## ❌ P0 核心模块门禁失败（开发分支）`,
              ``,
              `**提交者**: @${context.payload.pull_request.user.login}`,
              `**PR**: #${prNumber} - ${context.payload.pull_request.title}`,
              `**失败 Job**: [p0-core-gate](${runUrl})`,
              ``,
              `### 影响范围`,
              `P0 核心模块测试覆盖 141 项用例（含回归测试），失败表明核心模块存在回归。`,
              ``,
              `### 修复指引`,
              `1. 下载 artifact \`dev-p0-core-junit-report\` 查看详细失败用例`,
              `2. 本地复现：\`npm run test:p0:core\``,
              `3. 修复后重新推送，门禁将自动重跑`,
              ``,
              `<!-- auto-generated by p0-core-gate -->`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

  pre-push-hook-gate:         # pre-push 钩子 scope 校验回归测试（每次提交自动运行）
    name: Pre-push hook scope validation gate
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2  # 需要 HEAD~1 用于 scope 校验范围确定
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Shell 模拟测试：构造不合规 commit (fix(p0))，验证 pre-push 钩子拦截
      - name: Run pre-push hook simulation (shell, 2 scenarios)
        run: sh scripts/audit/simulate-pre-push-blocking.sh
      # CI 回归测试：18 个场景（6 正常 + 6 不合规 + 6 边界）
      - name: Run pre-push hook CI regression (Node.js, 18 scenarios)
        run: node scripts/audit/ci-pre-push-regression.mjs
        env:
          SH_BIN: sh
      # vitest 单元测试已在 test job 中通过 npm run test:ci 自动运行（10 场景）
      - name: Upload pre-push hook test logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c695131ce0f3a21bb6e049c944092a6 # v4.4.3
        with:
          name: dev-pre-push-hook-logs
          path: .tmp/logs/pre-push.log
          retention-days: 7
      # ═══ 失败告警：自动在 PR 上评论 ═══
      - name: Alert on PR failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## ❌ pre-push 钩子回归测试失败`,
              ``,
              `**提交者**: @${context.payload.pull_request.user.login}`,
              `**PR**: #${prNumber} - ${context.payload.pull_request.title}`,
              `**失败 Job**: [pre-push-hook-gate](${runUrl})`,
              ``,
              `### 影响范围`,
              `pre-push 钩子 scope 校验回归测试覆盖 30 个场景（Shell 2 + CI 18 + vitest 10），失败表明钩子拦截逻辑存在回归。`,
              ``,
              `### 修复指引`,
              `1. 下载 artifact \`dev-pre-push-hook-logs\` 查看日志`,
              `2. 本地复现：\`sh scripts/audit/simulate-pre-push-blocking.sh\``,
              `3. 本地复现：\`node scripts/audit/ci-pre-push-regression.mjs\``,
              `4. 本地复现：\`npx vitest run tests/unit/pre-push-scope-boundary.test.ts\``,
              `5. 修复后重新推送，门禁将自动重跑`,
              ``,
              `<!-- auto-generated by pre-push-hook-gate -->`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

  security-audit:             # 依赖安全审计（Phase2：high+critical 即阻断）
    name: Security audit (npm audit, Phase2 blocking)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
      # 复用现有模式：sed 切换 package-lock.json 中的 registry
      - name: Fix npm registry for audit (npmmirror → npmjs)
        run: sed -i 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' package-lock.json
      # npm config set 确保 audit API 请求走 npmjs.org
      - name: Switch npm config registry for audit
        run: npm config set registry https://registry.npmjs.org
      - name: Install dependencies (with npmjs registry)
        run: npm install --package-lock-only --no-audit
      # Phase2: high + critical 级别漏洞即阻断 CI
      - name: Run npm audit (high+critical = block)
        run: npm audit --audit-level=high
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c695131ce0f3a21bb6e049c944092a6 # v4.4.3
        with:
          name: dev-security-audit-report
          path: .npm/audit.json
          retention-days: 14

  ci-trigger-paths:           # CI 工作流触发路径 + 缓存策略验证（元测试，确保 YAML 配置正确）
    name: CI trigger paths validation
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pyyaml
        run: pip install pyyaml --quiet
      - name: Run CI trigger paths test (48 cases)
        run: python tests/test_ci_trigger_paths.py
