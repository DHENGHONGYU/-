# .github/workflows/ci.yml
# 开发分支（feat/**）精益门禁：快反馈，不阻塞主分支全量 CI（quality-check.yml 负责 main/develop）
# 设计依据：outputs/dev-remediation-roadmap-2026-07-23.md §P1-C（优秀案例基准校对后的修正设计）
name: CI (dev branches)

on:
  push:
    branches: ['feat/**', 'feature/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:                      # 快反馈门禁（typecheck + build）
    name: Smoke (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SHA pin 第三方 actions（防供应链攻击，与 quality-check.yml 一致）
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d71f2d81a # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
      # build 需要 esbuild 原生二进制，故不使用 --ignore-scripts
      - run: npm ci
      - name: Type check (tsc:prod)
        run: npm run tsc:prod
      - name: Production build
        run: npm run build

  test:                       # 测试 + 覆盖率（Phase1：先报告建基线，不硬卡）
    name: Test + coverage (report-only in Phase1)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d71f2d81a # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # Phase1 覆盖率仅报告，continue-on-error 使基线建立期不阻塞推送；
      # Phase2 改为 ratchet 下限（建议 line≥80 / branch≥70）后去掉 continue-on-error
      - name: Unit tests + coverage (Phase1 report-only)
        run: npm run test:ci
        continue-on-error: true
        env:
          CI: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-coverage-report
          path: coverage/
          retention-days: 7

  chart-industry-tests:       # 5 件套图表组件测试（feat 分支早反馈，强制阻塞）
    name: Chart industry tests (5-piece, P0 blocking)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d71f2d81a # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Run chart industry tests (106 cases)
        run: npm run test:chart:industry
        env:
          CI: true
      - name: Generate HTML report
        if: always()
        run: npm run report:chart
      - name: Upload chart test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-chart-industry-test-report
          path: |
            outputs/test-results/chart-tests.json
            outputs/test-results/chart-report.html
          retention-days: 7

  bootstrap-p0-gate:          # P0 强制门禁：种子数据重试 + 内存降级（开发分支必检，阻塞）
    name: Bootstrap P0 gate (seed retry + memory fallback)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d71f2d81a # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit
      - name: P0-1 种子数据重试 + P0-2 内存降级模式
        run: npm run test:bootstrap:p0
        env:
          CI: true
      - name: Upload bootstrap P0 test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-bootstrap-p0-test-report
          path: |
            src/services/system/bootstrapService.test.ts
          retention-days: 7

  layers:                     # 快边界审计留开发分支 PR/推送
    name: Layer boundary audit
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d71f2d81a # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: audit:layers (禁止跨层调用)
        run: npm run audit:layers

  databridge-gate:           # DataBridge 完整性快速门禁（开发分支必检，不阻塞推送）
    name: DataBridge integrity gate
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d71f2d81a # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: DataBridge 数据流转 + bootstrapService + ACL 完整性检查
        run: npm run test:databridge:gate
        env:
          CI: true

  p0-core-gate:              # P0 核心模块门禁（开发分支必检，阻塞推送）
    name: P0 core gate (cascade + databridgeAdapter + acl fail-closed + regression)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d71f2d81a # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: P0 核心模块测试（cascadeExecutor + databridgeAdapter + acl fail-closed + 回归测试，141 项用例）
        run: npm run test:p0:core:ci
        env:
          CI: true
      - name: Upload JUnit XML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-p0-core-junit-report
          path: reports/p0-core-junit.xml
          retention-days: 14
      - name: Upload P0 core test source files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-p0-core-test-files
          path: |
            src/core/cascadeExecutor.test.ts
            src/core/databridgeAdapter.test.ts
            src/core/acl.fail-closed.test.ts
            src/core/databridgeAdapter.regression.test.ts
          retention-days: 7
      # ═══ 失败告警：自动在 PR 上评论（feat/fix 分支） ═══
      - name: Alert on PR failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## ❌ P0 核心模块门禁失败（开发分支）`,
              ``,
              `**提交者**: @${context.payload.pull_request.user.login}`,
              `**PR**: #${prNumber} - ${context.payload.pull_request.title}`,
              `**失败 Job**: [p0-core-gate](${runUrl})`,
              ``,
              `### 影响范围`,
              `P0 核心模块测试覆盖 141 项用例（含回归测试），失败表明核心模块存在回归。`,
              ``,
              `### 修复指引`,
              `1. 下载 artifact \`dev-p0-core-junit-report\` 查看详细失败用例`,
              `2. 本地复现：\`npm run test:p0:core\``,
              `3. 修复后重新推送，门禁将自动重跑`,
              ``,
              `<!-- auto-generated by p0-core-gate -->`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

  git-autopush-test:          # GitAutoPush 模块 Pester 测试（开发分支门禁，不阻塞）
    name: GitAutoPush module tests
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run GitAutoPush Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = ".workbuddy\tests\GitAutoPush.Tests.ps1"
          $config.Output.Verbosity = "Detailed"
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = ".workbuddy\tests\testResults.xml"
          $config.TestResult.OutputFormat = "NUnitXml"
          Invoke-Pester -Configuration $config
      - name: Upload GitAutoPush test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-git-autopush-test-results
          path: |
            .workbuddy/tests/testResults.xml
          retention-days: 7
