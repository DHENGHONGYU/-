# FinSightV9 生产环境 nginx 配置
# - SPA fallback：所有未匹配静态资源的请求回退到 index.html（React Router）
# - gzip 压缩：js/css/json/svg 等文本资源压缩
# - 安全响应头：CSP 由 vite 注入到 index.html，此处补充 X-Frame-Options 等
# - 静态资源缓存：assets/* 长缓存（vite 内容哈希），index.html 不缓存

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ─── gzip 压缩配置 ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ─── 安全响应头 ────────────────────────────────────────────────────────────
    # 注意：CSP 由 vite.config.ts 的 inject-csp-meta 插件注入到 index.html，
    #       此处不再重复添加 Content-Security-Policy，避免冲突。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ─── 健康检查端点 ──────────────────────────────────────────────────────────
    # 用于 Docker HEALTHCHECK 与负载均衡探针
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain";
        return 200 "ok\n";
    }

    # ─── 反向代理公共设置 ─────────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    # ─── 兜底：/api/ 开头请求不走静态文件，防止被 location / 的 try_files 吞掉 ──
    location /api/ {
        return 404;
    }

    # ─── Python 采集服务代理（3 条，转发到 localhost:8000）────────────────────
    location /health {
        proxy_pass http://localhost:8000;
    }
    location /api/collect {
        proxy_pass http://localhost:8000;
    }
    location /api/akshare {
        rewrite ^/api/akshare(.*)$ $1 break;
        proxy_pass http://localhost:8000;
    }

    # ─── 腾讯行情 API 代理（需 Referer 头）──────────────────────────────────
    location /api/proxy/tencent {
        rewrite ^/api/proxy/tencent/(.*)$ /q=$1 break;
        proxy_pass https://qt.gtimg.cn;
        proxy_set_header Referer https://finance.qq.com;
        proxy_set_header Host qt.gtimg.cn;
    }
    location /api/proxy/tencent-kline {
        rewrite ^/api/proxy/tencent-kline/(.*)$ /$1 break;
        proxy_pass https://web.ifzq.gtimg.cn;
        proxy_set_header Referer https://finance.qq.com;
        proxy_set_header Host web.ifzq.gtimg.cn;
    }
    location /api/proxy/tencent-finance {
        rewrite ^/api/proxy/tencent-finance/(.*)$ /$1 break;
        proxy_pass https://proxy.finance.qq.com;
        proxy_set_header Referer https://finance.qq.com;
        proxy_set_header Host proxy.finance.qq.com;
    }
    location /api/proxy/smartbox {
        rewrite ^/api/proxy/smartbox/(.*)$ /s3/$1 break;
        proxy_pass https://smartbox.gtimg.cn;
        proxy_set_header Referer https://finance.qq.com;
        proxy_set_header Host smartbox.gtimg.cn;
    }

    # ─── 新浪行情 API 代理（需 Referer 头）──────────────────────────────────
    location /api/proxy/sina {
        rewrite ^/api/proxy/sina/(.*)$ /list=$1 break;
        proxy_pass https://hq.sinajs.cn;
        proxy_set_header Referer https://finance.sina.com.cn;
        proxy_set_header Host hq.sinajs.cn;
    }
    location /api/proxy/sina-finance {
        rewrite ^/api/proxy/sina-finance/(.*)$ /$1 break;
        proxy_pass https://vip.stock.finance.sina.com.cn;
        proxy_set_header Referer https://finance.sina.com.cn;
        proxy_set_header Host vip.stock.finance.sina.com.cn;
    }

    # ─── Tushare Pro API 代理 ────────────────────────────────────────────────
    location /api/proxy/tushare {
        rewrite ^/api/proxy/tushare/(.*)$ /$1 break;
        proxy_pass https://api.tushare.pro;
        proxy_set_header Host api.tushare.pro;
    }

    # ─── DeepSeek LLM API 代理 ───────────────────────────────────────────────
    location /api/proxy/deepseek {
        rewrite ^/api/proxy/deepseek/(.*)$ /$1 break;
        proxy_pass https://api.deepseek.com;
        proxy_set_header Host api.deepseek.com;
        proxy_read_timeout 120s;
    }

    # ─── 东方财富数据 API 代理（需 Referer 头）────────────────────────────────
    location /api/proxy/em-datacenter {
        rewrite ^/api/proxy/em-datacenter/(.*)$ /$1 break;
        proxy_pass https://datacenter-web.eastmoney.com;
        proxy_set_header Referer https://data.eastmoney.com/;
        proxy_set_header Host datacenter-web.eastmoney.com;
    }
    location /api/proxy/em-reportapi {
        rewrite ^/api/proxy/em-reportapi/(.*)$ /$1 break;
        proxy_pass https://reportapi.eastmoney.com;
        proxy_set_header Referer https://data.eastmoney.com/;
        proxy_set_header Host reportapi.eastmoney.com;
    }
    location /api/proxy/em-notice {
        rewrite ^/api/proxy/em-notice/(.*)$ /$1 break;
        proxy_pass https://np-anotice-stock.eastmoney.com;
        proxy_set_header Referer https://data.eastmoney.com/;
        proxy_set_header Host np-anotice-stock.eastmoney.com;
    }
    location /api/proxy/em-f10 {
        rewrite ^/api/proxy/em-f10/(.*)$ /$1 break;
        proxy_pass https://emweb.securities.eastmoney.com;
        proxy_set_header Referer https://emweb.securities.eastmoney.com/;
        proxy_set_header Host emweb.securities.eastmoney.com;
    }
    location /api/proxy/em-guba {
        rewrite ^/api/proxy/em-guba/(.*)$ /$1 break;
        proxy_pass https://guba.eastmoney.com;
        proxy_set_header Referer https://guba.eastmoney.com/;
        proxy_set_header Host guba.eastmoney.com;
    }

    # ─── Embedding 服务代理（转发到 localhost:8001）─────────────────────────
    location /api/embed {
        proxy_pass http://localhost:8001;
        proxy_read_timeout 120s;
    }

    # ─── 静态资源长缓存（vite 内容哈希命名，可安全使用 immutable）─────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ─── theme-boot.js 不缓存（无 hash 的入口脚本，必须即时更新）──────────────
    location = /theme-boot.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # ─── public/ 下数据文件不缓存（会更新的配置）────────────────────────────
    location ~* /(manifest\.json|health-report\.json|ai-memory-index\.json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ─── SPA fallback：所有未匹配路由回退到 index.html ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── index.html 不缓存（保证发布后立即生效）──────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # ─── 隐藏 .git/.env 等敏感文件 ─────────────────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
