    <style id="theme-vars">
/* V9 Cockpit Redesign - Decision Flow Dashboard Theme */
/* Brand prefix: v9 */

:root {
  /* Core surfaces */
  --v9-background: #f1f5f9;
  --v9-foreground: #0f172a;

  --v9-card: #ffffff;
  --v9-card-foreground: #1e293b;

  --v9-popover: #ffffff;
  --v9-popover-foreground: #0f172a;

  /* Primary - Professional blue */
  --v9-primary: #2563eb;
  --v9-primary-foreground: #ffffff;

  /* Muted tones */
  --v9-muted: #f1f5f9;
  --v9-muted-foreground: #64748b;

  /* Borders & inputs */
  --v9-border: #e2e8f0;
  --v9-input: #e2e8f0;
  --v9-ring: #3b82f6;

  /* Radius scale */
  --v9-radius-sm: 6px;
  --v9-radius-md: 8px;
  --v9-radius-lg: 12px;

  /* Financial semantic colors */
  --v9-up: #16a34a;
  --v9-up-bg: #dcfce7;
  --v9-down: #dc2626;
  --v9-down-bg: #fee2e2;
  --v9-neutral: #64748b;
  --v9-warning: #f59e0b;
  --v9-warning-bg: #fef3c7;
  --v9-info: #3b82f6;
  --v9-info-bg: #dbeafe;

  /* Section accent colors */
  --v9-accent-market: #3b82f6;
  --v9-accent-opportunity: #10b981;
  --v9-accent-portfolio: #f59e0b;
  --v9-accent-ai: #8b5cf6;

  /* Typography */
  --v9-font-sans: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --v9-font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", monospace;

  /* Shadows */
  --v9-shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
  --v9-shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
  --v9-shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.05);
}

html {
  font-family: var(--v9-font-sans);
  color: var(--v9-foreground);
  background: var(--v9-background);
}

body {
  margin: 0;
  font-family: var(--v9-font-sans);
  color: var(--v9-foreground);
  background: var(--v9-background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Numeric data display */
.tabular-nums {
  font-variant-numeric: tabular-nums;
  font-family: var(--v9-font-mono);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--v9-background);
    --color-foreground: var(--v9-foreground);
    --color-card: var(--v9-card);
    --color-card-foreground: var(--v9-card-foreground);
    --color-popover: var(--v9-popover);
    --color-popover-foreground: var(--v9-popover-foreground);
    --color-primary: var(--v9-primary);
    --color-primary-foreground: var(--v9-primary-foreground);
    --color-muted: var(--v9-muted);
    --color-muted-foreground: var(--v9-muted-foreground);
    --color-border: var(--v9-border);
    --color-input: var(--v9-input);
    --color-ring: var(--v9-ring);
    --radius-sm: var(--v9-radius-sm);
    --radius-md: var(--v9-radius-md);
    --radius-lg: var(--v9-radius-lg);
  }
  @layer base {
    body { background: var(--v9-background); color: var(--v9-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
