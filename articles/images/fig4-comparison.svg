<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="sh4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#292524" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="680" height="400" fill="#fafaf9"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">改造前后时间分配对比 · 一个项目周期（6周）</text>
  <text x="340" y="56" text-anchor="middle" font-size="12" fill="#78716c">重复劳动被分身接管，时间回流到专业判断与团队培养</text>

  <!-- 图例 -->
  <g font-size="11.5" fill="#44403c">
    <rect x="120" y="76" width="14" height="14" rx="3" fill="#ef4444"/>
    <text x="140" y="88">重复性复核劳动</text>
    <rect x="260" y="76" width="14" height="14" rx="3" fill="#10b981"/>
    <text x="280" y="88">专业判断与签字决策</text>
    <rect x="430" y="76" width="14" height="14" rx="3" fill="#3b82f6"/>
    <text x="450" y="88">团队培养</text>
    <rect x="540" y="76" width="14" height="14" rx="3" fill="#a8a29e"/>
    <text x="560" y="88">沟通协调</text>
  </g>

  <!-- 改造前 条 -->
  <text x="40" y="140" font-size="14" font-weight="600" fill="#1c1917">改造前</text>
  <text x="40" y="158" font-size="11" fill="#78716c">分身介入前</text>
  <!-- 条 45/15/10/30 总宽600，从x=40开始 -->
  <g filter="url(#sh4)">
    <rect x="40" y="172" width="270" height="44" rx="6" fill="#ef4444"/>
    <rect x="310" y="172" width="90" height="44" fill="#10b981"/>
    <rect x="400" y="172" width="60" height="44" fill="#3b82f6"/>
    <rect x="460" y="172" width="180" height="44" rx="6" fill="#a8a29e"/>
  </g>
  <text x="175" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">45%</text>
  <text x="355" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">15%</text>
  <text x="430" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">10%</text>
  <text x="550" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">30%</text>

  <!-- 箭头 -->
  <text x="340" y="244" text-anchor="middle" font-size="20" fill="#10b981">↓ 分身接管重复劳动 ↓</text>

  <!-- 改造后 条 -->
  <text x="40" y="280" font-size="14" font-weight="600" fill="#1c1917">改造后</text>
  <text x="40" y="298" font-size="11" fill="#78716c">分身介入后</text>
  <!-- 条 18/38/20/24 -->
  <g filter="url(#sh4)">
    <rect x="40" y="312" width="108" height="44" rx="6" fill="#ef4444"/>
    <rect x="148" y="312" width="228" height="44" fill="#10b981"/>
    <rect x="376" y="312" width="120" height="44" fill="#3b82f6"/>
    <rect x="496" y="312" width="144" height="44" rx="6" fill="#a8a29e"/>
  </g>
  <text x="94" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">18%</text>
  <text x="262" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">38%</text>
  <text x="436" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">20%</text>
  <text x="568" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">24%</text>

  <!-- 变化标注 -->
  <text x="94" y="376" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="600">↓27%</text>
  <text x="262" y="376" text-anchor="middle" font-size="11" fill="#047857" font-weight="600">↑23%</text>
  <text x="436" y="376" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="600">↑10%</text>
  <text x="568" y="376" text-anchor="middle" font-size="11" fill="#78716c">↓6%</text>
</svg>
