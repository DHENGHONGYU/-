# Prometheus configuration for V9 Data Collector monitoring
# Scrapes data-collector metrics and node-exporter every 15s

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# Alerting rules for cache monitoring
rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # V9 Data Collector - cache performance metrics
  - job_name: 'v9-data-collector'
    static_configs:
      - targets: ['data-collector:8000']
    scrape_interval: 15s
    metrics_path: '/metrics'

  # Node Exporter - system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
