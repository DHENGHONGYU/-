# =============================================================================
# pip 安全配置 — 安全优先策略
# =============================================================================
# 部署位置（Windows 当前用户）：%APPDATA%\pip\pip.ini
# 部署位置（项目级参考）：项目根目录 pip.conf（需 PIP_CONFIG_FILE 环境变量指向）
# 策略：受信任主机 + 要求哈希校验 + 禁止非 ASCII + 超时控制
# =============================================================================

[global]
# --- 受信任源 ---
# 国内镜像加速，同时标记为 trusted-host（跳过 HTTPS 验证仅对镜像）
index-url = https://pypi.tuna.tsinghua.edu.cn/simple
trusted-host = pypi.tuna.tsinghua.edu.cn
    pypi.org
    files.pythonhosted.org

# --- 哈希校验 ---
# 要求所有安装的包都带有哈希校验（需配合 requirements.txt 中的哈希）
# 注意：开启后无法安装无哈希的包，适合生产环境
# require-hashes = true

# --- 安全检查 ---
# 启用 pip-audit 风格的漏洞检查（需 pip install pip-audit）
# disable-pip-version-check = true

# --- 超时与重试 ---
# 单包下载超时（秒）
timeout = 60
# 重试次数
retries = 3

# --- 编码限制 ---
# 禁止非 ASCII 包名（防止同形异义攻击）
no-color = true

[install]
# 禁止执行包安装时的 Python 脚本（类似 npm ignore-scripts）
# 注意：部分包（如 playwright）需要此选项才能安装浏览器驱动
# 如需安装 playwright 浏览器，临时注释此行
no-build-isolation = false
