<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#292524" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="emg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="680" height="480" fill="#fafaf9"/>
  <!-- 标题 -->
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">4 指挥官 × 20 分身 · 审计工作流架构</text>
  <text x="340" y="56" text-anchor="middle" font-size="12" fill="#78716c">合伙人编排指挥官，指挥官调度分身，分身夜间作战</text>

  <!-- 顶层：合伙人 -->
  <rect x="270" y="78" width="140" height="48" rx="10" fill="url(#emg)" filter="url(#shadow1)"/>
  <text x="340" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">合伙人（你）</text>
  <text x="340" y="117" text-anchor="middle" font-size="11" fill="#d1fae5">验收 · 判断 · 签字</text>

  <!-- 连线 顶层→中层 -->
  <line x1="340" y1="126" x2="340" y2="150" stroke="#a8a29e" stroke-width="1.5"/>
  <line x1="95" y1="150" x2="585" y2="150" stroke="#a8a29e" stroke-width="1.5"/>
  <line x1="95" y1="150" x2="95" y2="170" stroke="#a8a29e" stroke-width="1.5"/>
  <line x1="258" y1="150" x2="258" y2="170" stroke="#a8a29e" stroke-width="1.5"/>
  <line x1="421" y1="150" x2="421" y2="170" stroke="#a8a29e" stroke-width="1.5"/>
  <line x1="585" y1="150" x2="585" y2="170" stroke="#a8a29e" stroke-width="1.5"/>

  <!-- 中层：4个指挥官 -->
  <g>
    <rect x="28" y="170" width="134" height="56" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="95" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1917">项目复核官</text>
    <text x="95" y="212" text-anchor="middle" font-size="10.5" fill="#78716c">底稿·复核·意见追踪</text>
  </g>
  <g>
    <rect x="191" y="170" width="134" height="56" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="258" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1917">行业研究官</text>
    <text x="258" y="212" text-anchor="middle" font-size="10.5" fill="#78716c">行业·风险·监管动态</text>
  </g>
  <g>
    <rect x="354" y="170" width="134" height="56" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="421" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1917">团队培养官</text>
    <text x="421" y="212" text-anchor="middle" font-size="10.5" fill="#78716c">培训·答疑·复盘</text>
  </g>
  <g>
    <rect x="518" y="170" width="134" height="56" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="585" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1917">知识资产官</text>
    <text x="585" y="212" text-anchor="middle" font-size="10.5" fill="#78716c">SOP·案例·方法论</text>
  </g>

  <!-- 连线 中层→分身 -->
  <line x1="95" y1="226" x2="95" y2="248" stroke="#d6d3d1" stroke-width="1.2"/>
  <line x1="258" y1="226" x2="258" y2="248" stroke="#d6d3d1" stroke-width="1.2"/>
  <line x1="421" y1="226" x2="421" y2="248" stroke="#d6d3d1" stroke-width="1.2"/>
  <line x1="585" y1="226" x2="585" y2="248" stroke="#d6d3d1" stroke-width="1.2"/>

  <!-- 底层：分身节点（每个指挥官下面4-5个） -->
  <!-- 项目复核官 分身 -->
  <g font-size="10" fill="#44403c">
    <circle cx="42" cy="262" r="13" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
    <text x="42" y="285" text-anchor="middle">合并报表</text>
    <circle cx="80" cy="262" r="13" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
    <text x="80" y="285" text-anchor="middle">关联交易</text>
    <circle cx="118" cy="262" r="13" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
    <text x="118" y="285" text-anchor="middle">收入确认</text>
    <circle cx="48" cy="318" r="13" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
    <text x="48" y="341" text-anchor="middle">函证复核</text>
    <circle cx="92" cy="318" r="13" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
    <text x="92" y="341" text-anchor="middle">内控测试</text>
  </g>

  <!-- 行业研究官 分身 -->
  <g font-size="10" fill="#44403c">
    <circle cx="205" cy="262" r="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="205" y="285" text-anchor="middle">行业概览</text>
    <circle cx="243" cy="262" r="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="243" y="285" text-anchor="middle">监管动态</text>
    <circle cx="281" cy="262" r="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="281" y="285" text-anchor="middle">竞品分析</text>
    <circle cx="225" cy="318" r="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="225" y="341" text-anchor="middle">风险预警</text>
  </g>

  <!-- 团队培养官 分身 -->
  <g font-size="10" fill="#44403c">
    <circle cx="368" cy="262" r="13" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="368" y="285" text-anchor="middle">新手答疑</text>
    <circle cx="406" cy="262" r="13" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="406" y="285" text-anchor="middle">案例讲解</text>
    <circle cx="444" cy="262" r="13" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="444" y="285" text-anchor="middle">培训课件</text>
    <circle cx="388" cy="318" r="13" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="388" y="341" text-anchor="middle">复盘归档</text>
  </g>

  <!-- 知识资产官 分身 -->
  <g font-size="10" fill="#44403c">
    <circle cx="532" cy="262" r="13" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="532" y="285" text-anchor="middle">SOP沉淀</text>
    <circle cx="570" cy="262" r="13" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="570" y="285" text-anchor="middle">底稿模板</text>
    <circle cx="608" cy="262" r="13" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="608" y="285" text-anchor="middle">方法论库</text>
    <circle cx="552" cy="318" r="13" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="552" y="341" text-anchor="middle">判例索引</text>
  </g>

  <!-- 底部说明 -->
  <rect x="28" y="380" width="624" height="76" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <circle cx="52" cy="404" r="6" fill="#10b981"/>
  <text x="68" y="408" font-size="12" fill="#44403c">夜间作战：自动化任务驱动分身执行校验、比对、初稿生成</text>
  <circle cx="52" cy="428" r="6" fill="#3b82f6"/>
  <text x="68" y="432" font-size="12" fill="#44403c">白天验收：合伙人只做专业判断与签字决策，重复劳动交给分身</text>
  <text x="340" y="460" text-anchor="middle" font-size="11" fill="#a8a29e" font-style="italic">你睡觉的时候，分身在战斗；你醒来的时候，弹药已上膛</text>
</svg>
