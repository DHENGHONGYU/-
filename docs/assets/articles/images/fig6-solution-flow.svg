<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="sh6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#292524" flood-opacity="0.08"/>
    </filter>
    <marker id="arr6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a8a29e"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fafaf9"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">工作模式选择决策流 · Craft / Plan / Ask</text>
  <text x="340" y="56" text-anchor="middle" font-size="12" fill="#78716c">按任务性质选模式，别一种模式走天下</text>

  <!-- 起点 -->
  <rect x="270" y="80" width="140" height="44" rx="22" fill="#1c1917" filter="url(#sh6)"/>
  <text x="340" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">任务来了</text>
  <line x1="340" y1="124" x2="340" y2="148" stroke="#a8a29e" stroke-width="1.8" marker-end="url(#arr6)"/>

  <!-- 判断1 菱形 -->
  <polygon points="340,152 470,200 340,248 210,200" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#sh6)"/>
  <text x="340" y="192" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c1917">涉及文件修改 /</text>
  <text x="340" y="210" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c1917">批量操作 / 对外发送？</text>

  <!-- 是 → Plan -->
  <line x1="210" y1="200" x2="150" y2="200" stroke="#a8a29e" stroke-width="1.8" marker-end="url(#arr6)"/>
  <text x="180" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">是</text>
  <rect x="24" y="176" width="124" height="48" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#sh6)"/>
  <text x="86" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Plan 模式</text>
  <text x="86" y="215" text-anchor="middle" font-size="10.5" fill="#92400e">先规划后执行</text>

  <!-- 否 → 判断2 -->
  <line x1="340" y1="248" x2="340" y2="278" stroke="#a8a29e" stroke-width="1.8" marker-end="url(#arr6)"/>
  <text x="354" y="268" font-size="11" font-weight="600" fill="#78716c">否</text>

  <!-- 判断2 菱形 -->
  <polygon points="340,282 470,330 340,378 210,330" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#sh6)"/>
  <text x="340" y="322" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c1917">纯读取 / 整理 /</text>
  <text x="340" y="340" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c1917">分析 / 生成初稿？</text>

  <!-- 是 → Craft -->
  <line x1="210" y1="330" x2="150" y2="330" stroke="#a8a29e" stroke-width="1.8" marker-end="url(#arr6)"/>
  <text x="180" y="322" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">是</text>
  <rect x="24" y="306" width="124" height="48" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2" filter="url(#sh6)"/>
  <text x="86" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Craft 模式</text>
  <text x="86" y="345" text-anchor="middle" font-size="10.5" fill="#065f46">立即执行</text>

  <!-- 否 → Ask -->
  <line x1="470" y1="330" x2="530" y2="330" stroke="#a8a29e" stroke-width="1.8" marker-end="url(#arr6)"/>
  <text x="500" y="322" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">否</text>
  <rect x="532" y="306" width="124" height="48" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#sh6)"/>
  <text x="594" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Ask 模式</text>
  <text x="594" y="345" text-anchor="middle" font-size="10.5" fill="#1e40af">只问答不动手</text>

  <!-- 底部占比提示 -->
  <rect x="120" y="404" width="440" height="24" rx="12" fill="#f5f5f4" stroke="#e7e5e4"/>
  <text x="340" y="421" text-anchor="middle" font-size="11.5" fill="#57534e">审计日常约 80% 是"读—分析—出文档"→ Craft 模式，Plan 留给真正要拍板的决策点</text>
</svg>
