<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="sh5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#292524" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="680" height="460" fill="#fafaf9"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">审计场景 5 个真实踩坑 · 一图速览</text>
  <text x="340" y="56" text-anchor="middle" font-size="12" fill="#78716c">都不是 bug，而是"没把工具调教成自己的形状"</text>

  <!-- 坑1 -->
  <rect x="24" y="78" width="306" height="110" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5" filter="url(#sh5)"/>
  <circle cx="54" cy="108" r="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="54" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">1</text>
  <text x="82" y="104" font-size="13.5" font-weight="600" fill="#1c1917">人格漂移</text>
  <text x="82" y="122" font-size="10.5" fill="#a8a29e">记忆层 · SOUL.md</text>
  <text x="40" y="148" font-size="11.5" fill="#57534e">分身越用越不像你，长对话把</text>
  <text x="40" y="165" font-size="11.5" fill="#57534e">它带成"客服腔"。解法：把语体</text>
  <text x="40" y="182" font-size="11.5" fill="#57534e">硬规则写死在 SOUL.md 置顶位</text>

  <!-- 坑2 -->
  <rect x="350" y="78" width="306" height="110" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5" filter="url(#sh5)"/>
  <circle cx="380" cy="108" r="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">2</text>
  <text x="408" y="104" font-size="13.5" font-weight="600" fill="#1c1917">Skills 触发不灵</text>
  <text x="408" y="122" font-size="10.5" fill="#a8a29e">技能系统 · 触发词</text>
  <text x="366" y="148" font-size="11.5" fill="#57534e">审计术语变体多，触发词写少了</text>
  <text x="366" y="165" font-size="11.5" fill="#57534e">覆盖不到。解法：按"同义词+动作</text>
  <text x="366" y="182" font-size="11.5" fill="#57534e">意图"穷举，找非作者测触发</text>

  <!-- 坑3 -->
  <rect x="24" y="204" width="306" height="110" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5" filter="url(#sh5)"/>
  <circle cx="54" cy="234" r="16" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="54" y="239" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">3</text>
  <text x="82" y="230" font-size="13.5" font-weight="600" fill="#1c1917">MCP 串数据</text>
  <text x="82" y="248" font-size="10.5" fill="#a8a29e">连接器 · 权限隔离</text>
  <text x="40" y="274" font-size="11.5" fill="#57534e">多项目共用账号，分身拉错客户</text>
  <text x="40" y="291" font-size="11.5" fill="#57534e">文件。解法：按项目隔离连接器，</text>
  <text x="40" y="308" font-size="11.5" fill="#57534e">SOUL.md 写死文件边界红线</text>

  <!-- 坑4 -->
  <rect x="350" y="204" width="306" height="110" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5" filter="url(#sh5)"/>
  <circle cx="380" cy="234" r="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="380" y="239" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">4</text>
  <text x="408" y="230" font-size="13.5" font-weight="600" fill="#1c1917">时区错乱</text>
  <text x="408" y="248" font-size="10.5" fill="#a8a29e">自动化任务 · 定时调度</text>
  <text x="366" y="274" font-size="11.5" fill="#57534e">夜间任务没跑或跑错时间，ISO</text>
  <text x="366" y="291" font-size="11.5" fill="#57534e">时间没带时区。解法：显式带</text>
  <text x="366" y="308" font-size="11.5" fill="#57534e">+08:00，首日盯执行记录</text>

  <!-- 坑5 -->
  <rect x="187" y="330" width="306" height="110" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5" filter="url(#sh5)"/>
  <circle cx="217" cy="360" r="16" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="217" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">5</text>
  <text x="245" y="356" font-size="13.5" font-weight="600" fill="#1c1917">Plan 模式过度规划</text>
  <text x="245" y="374" font-size="10.5" fill="#a8a29e">工作模式 · Craft/Plan/Ask</text>
  <text x="203" y="400" font-size="11.5" fill="#57534e">简单任务被拆 7 步等确认，反而</text>
  <text x="203" y="417" font-size="11.5" fill="#57534e">更慢。解法：按任务性质选模式，</text>
  <text x="203" y="434" font-size="11.5" fill="#57534e">读分析用 Craft，改文件用 Plan</text>
</svg>
