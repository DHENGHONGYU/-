<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V9 MCP 架构解耦分析</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .card-hover { transition: all 0.3s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    .flow-arrow { animation: flowPulse 2s infinite; }
    @keyframes flowPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    .score-bar { transition: width 0.8s ease-out; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // 数据定义
    const architectureData = {
      modules: [
        { name: '配置层', path: 'src/config/', score: 95, status: 'excellent', desc: '零硬编码，纯声明式配置' },
        { name: '核心层', path: 'src/core/', score: 92, status: 'excellent', desc: 'DataBridge/Envelope/ACL 职责明确' },
        { name: '数据层', path: 'src/data/', score: 78, status: 'good', desc: 'IndexedDB 封装，部分方法绕过 DataBridge' },
        { name: '服务层', path: 'src/services/', score: 88, status: 'good', desc: '业务逻辑通过 DataBridge 访问数据' },
        { name: '状态层', path: 'src/store/', score: 90, status: 'excellent', desc: 'Zustand + withBroadcast 广播机制' },
        { name: '页面层', path: 'src/pages/', score: 85, status: 'good', desc: 'UI 组件只依赖 store 和 services' },
      ],
      patterns: [
        { name: '信封模式', score: 98, benefits: ['接口抽象', '元数据追踪', '类型安全', '零硬编码'] },
        { name: 'DataBridge 路由', score: 95, benefits: ['单一职责', '依赖倒置', '开闭原则', '错误隔离'] },
        { name: 'EventBus 发布订阅', score: 96, benefits: ['松耦合', '动态订阅', '错误隔离', '内存安全'] },
        { name: 'ACL 权限矩阵', score: 94, benefits: ['声明式权限', '最小权限', '运行时校验', '零硬编码'] },
        { name: 'withBroadcast', score: 92, benefits: ['职责分离', '代码复用', '错误隔离'] },
        { name: 'MemoryCache LRU', score: 90, benefits: ['独立模块', '可配置', '自动清理', '命名空间隔离'] },
      ],
      issues: [
        { id: 1, severity: 'P0', title: 'dataLayer 部分方法未通过 DataBridge', file: 'src/data/dataLayer.ts', lines: 'L474-485, L538-544, L562-564', impact: '绕过 ACL 和审计', effort: '2小时' },
        { id: 2, severity: 'P1', title: 'routeToDB() 违反开闭原则', file: 'src/core/databridge.ts', lines: 'L218-444', impact: '30+ case 分支，代码膨胀', effort: '1天' },
        { id: 3, severity: 'P1', title: '读操作直接访问 db', file: 'src/data/dataLayer.ts', lines: 'L71-164', impact: '绕过权限校验', effort: '1天' },
        { id: 4, severity: 'P2', title: '事件名称硬编码分散', file: '多处', lines: '-', impact: '重复定义，易出错', effort: '4小时' },
        { id: 5, severity: 'P2', title: 'DataBridge 缺少缓存集成', file: 'src/core/databridge.ts', lines: '-', impact: '读性能未优化', effort: '4小时' },
        { id: 6, severity: 'P2', title: 'broadcast() 未使用常量', file: 'src/core/databridge.ts', lines: 'L748', impact: '硬编码字符串', effort: '1小时' },
        { id: 7, severity: 'P2', title: 'inferStore() 字符串匹配', file: 'src/core/databridge.ts', lines: 'L58-79', impact: '类型不安全', effort: '2小时' },
      ],
      dataFlow: [
        { from: 'UI', to: 'Store', type: 'read', desc: '组件订阅状态' },
        { from: 'Store', to: 'Service', type: 'call', desc: '调用业务方法' },
        { from: 'Service', to: 'DataBridge', type: 'write', desc: '封装 Envelope' },
        { from: 'DataBridge', to: 'ACL', type: 'check', desc: '权限校验' },
        { from: 'ACL', to: 'DB', type: 'write', desc: '路由到 IndexedDB' },
        { from: 'DB', to: 'EventBus', type: 'emit', desc: '广播变更事件' },
        { from: 'EventBus', to: 'Store', type: 'notify', desc: '更新状态' },
        { from: 'Store', to: 'UI', type: 'render', desc: '触发重渲染' },
      ]
    };

    function ScoreBar({ score, status }) {
      const color = status === 'excellent' ? 'bg-green-500' : status === 'good' ? 'bg-blue-500' : 'bg-yellow-500';
      return (
        <div className="w-full bg-gray-200 rounded-full h-2.5">
          <div className={`score-bar ${color} h-2.5 rounded-full`} style={{width: `${score}%`}}></div>
        </div>
      );
    }

    function SeverityBadge({ severity }) {
      const colors = {
        'P0': 'bg-red-100 text-red-800 border-red-300',
        'P1': 'bg-orange-100 text-orange-800 border-orange-300',
        'P2': 'bg-yellow-100 text-yellow-800 border-yellow-300'
      };
      return (
        <span className={`px-2 py-1 text-xs font-semibold rounded border ${colors[severity]}`}>
          {severity}
        </span>
      );
    }

    function ArchitectureLayer({ module }) {
      return (
        <div className="bg-white rounded-lg shadow-md p-6 card-hover">
          <div className="flex justify-between items-start mb-3">
            <div>
              <h3 className="text-lg font-bold text-gray-900">{module.name}</h3>
              <p className="text-sm text-gray-500 font-mono">{module.path}</p>
            </div>
            <div className="text-3xl font-bold text-gray-900">{module.score}</div>
          </div>
          <p className="text-sm text-gray-600 mb-3">{module.desc}</p>
          <ScoreBar score={module.score} status={module.status} />
        </div>
      );
    }

    function PatternCard({ pattern }) {
      return (
        <div className="bg-white rounded-lg shadow-md p-6 card-hover">
          <div className="flex justify-between items-center mb-4">
            <h3 className="text-lg font-bold text-gray-900">{pattern.name}</h3>
            <div className="text-2xl font-bold text-green-600">{pattern.score}</div>
          </div>
          <div className="space-y-2">
            {pattern.benefits.map((benefit, i) => (
              <div key={i} className="flex items-center text-sm">
                <svg className="w-4 h-4 text-green-500 mr-2" fill="currentColor" viewBox="0 0 20 20">
                  <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd"/>
                </svg>
                <span className="text-gray-700">{benefit}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function IssueRow({ issue }) {
      return (
        <tr className="border-b hover:bg-gray-50">
          <td className="py-3 px-4"><SeverityBadge severity={issue.severity} /></td>
          <td className="py-3 px-4 font-medium text-gray-900">{issue.title}</td>
          <td className="py-3 px-4 font-mono text-sm text-gray-600">{issue.file}</td>
          <td className="py-3 px-4 font-mono text-sm text-gray-600">{issue.lines}</td>
          <td className="py-3 px-4 text-sm text-gray-600">{issue.impact}</td>
          <td className="py-3 px-4 text-sm font-semibold text-gray-900">{issue.effort}</td>
        </tr>
      );
    }

    function DataFlowDiagram() {
      return (
        <div className="bg-white rounded-lg shadow-md p-6">
          <h3 className="text-xl font-bold text-gray-900 mb-6">数据流转链路</h3>
          <div className="space-y-3">
            {architectureData.dataFlow.map((step, i) => (
              <div key={i} className="flex items-center">
                <div className="flex-shrink-0 w-20 text-right font-mono text-sm font-bold text-gray-700">{step.from}</div>
                <div className="flex-1 mx-4 flex items-center">
                  <div className="flex-1 h-0.5 bg-gradient-to-r from-blue-400 to-purple-400 flow-arrow"></div>
                  <div className="mx-2 px-3 py-1 bg-gray-100 rounded text-xs font-semibold text-gray-700">{step.type}</div>
                  <div className="flex-1 h-0.5 bg-gradient-to-r from-purple-400 to-pink-400 flow-arrow"></div>
                </div>
                <div className="flex-shrink-0 w-20 font-mono text-sm font-bold text-gray-700">{step.to}</div>
                <div className="ml-4 text-sm text-gray-600 w-48">{step.desc}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('overview');

      const tabs = [
        { id: 'overview', label: '架构概览' },
        { id: 'patterns', label: '设计模式' },
        { id: 'issues', label: '改进建议' },
        { id: 'flow', label: '数据流转' }
      ];

      return (
        <div className="min-h-screen bg-gray-50">
          <div className="gradient-bg text-white py-12">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <h1 className="text-4xl font-bold mb-2">V9 智能投研复盘系统</h1>
              <p className="text-xl opacity-90">MCP 最小耦合原则合规性分析报告</p>
              <div className="mt-6 flex items-center space-x-8">
                <div>
                  <div className="text-3xl font-bold">87.5</div>
                  <div className="text-sm opacity-80">总体评分</div>
                </div>
                <div>
                  <div className="text-3xl font-bold">7</div>
                  <div className="text-sm opacity-80">待改进项</div>
                </div>
                <div>
                  <div className="text-3xl font-bold">6</div>
                  <div className="text-sm opacity-80">优秀实践</div>
                </div>
              </div>
            </div>
          </div>

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div className="border-b border-gray-200 mb-8">
              <nav className="-mb-px flex space-x-8">
                {tabs.map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`py-4 px-1 border-b-2 font-medium text-sm ${
                      activeTab === tab.id
                        ? 'border-purple-500 text-purple-600'
                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </nav>
            </div>

            {activeTab === 'overview' && (
              <div>
                <h2 className="text-2xl font-bold text-gray-900 mb-6">分层架构评分</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                  {architectureData.modules.map((module, i) => (
                    <ArchitectureLayer key={i} module={module} />
                  ))}
                </div>
                <div className="bg-blue-50 border border-blue-200 rounded-lg p-6">
                  <h3 className="text-lg font-bold text-blue-900 mb-3">总体评价</h3>
                  <p className="text-blue-800">
                    系统整体架构设计优秀，符合 MCP 原则的核心思想。分层清晰，职责明确，数据流闭环完整。
                    主要优势在于信封模式、DataBridge 路由中枢、EventBus 发布订阅等设计模式的有效应用。
                    需要关注的是部分 dataLayer 方法绕过 DataBridge 直接访问 db，以及 routeToDB() 的 switch-case 膨胀问题。
                  </p>
                </div>
              </div>
            )}

            {activeTab === 'patterns' && (
              <div>
                <h2 className="text-2xl font-bold text-gray-900 mb-6">优秀设计模式</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {architectureData.patterns.map((pattern, i) => (
                    <PatternCard key={i} pattern={pattern} />
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'issues' && (
              <div>
                <h2 className="text-2xl font-bold text-gray-900 mb-6">改进建议（按优先级排序）</h2>
                <div className="bg-white rounded-lg shadow-md overflow-hidden">
                  <table className="w-full">
                    <thead className="bg-gray-50">
                      <tr>
                        <th className="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">优先级</th>
                        <th className="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">问题</th>
                        <th className="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">文件</th>
                        <th className="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">行号</th>
                        <th className="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">影响</th>
                        <th className="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">工作量</th>
                      </tr>
                    </thead>
                    <tbody>
                      {architectureData.issues.map(issue => (
                        <IssueRow key={issue.id} issue={issue} />
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="mt-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-red-50 border border-red-200 rounded-lg p-4">
                    <h4 className="font-bold text-red-900 mb-2">P0 阻断性</h4>
                    <p className="text-sm text-red-800">1 项需立即修复</p>
                  </div>
                  <div className="bg-orange-50 border border-orange-200 rounded-lg p-4">
                    <h4 className="font-bold text-orange-900 mb-2">P1 严重</h4>
                    <p className="text-sm text-orange-800">2 项本周内完成</p>
                  </div>
                  <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                    <h4 className="font-bold text-yellow-900 mb-2">P2 优化</h4>
                    <p className="text-sm text-yellow-800">4 项本月内完成</p>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'flow' && (
              <DataFlowDiagram />
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
